:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#060f20; --ink:#e8eef7; --muted:#8fa3c2; --frame:#1d3b6b; }
}
:root[data-theme="dark"]{ --bg:#060f20; --ink:#e8eef7; --muted:#8fa3c2; --frame:#1d3b6b; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; overflow:hidden;
}
#wrap{
  width:min(calc(100vw - 16px), calc((100vh - 90px) * 16 / 9));
  aspect-ratio:16/9;
}
canvas{
  width:100%; height:100%; display:block;
  image-rendering:pixelated; image-rendering:crisp-edges;
  border:3px solid var(--frame); border-radius:4px;
  touch-action:none; background:#0b1a3a;
}
canvas:focus-visible{outline:3px solid #ffd34d; outline-offset:3px}
.note{margin:0; font-size:14px; line-height:1.5; color:var(--muted); text-align:center; max-width:70ch; padding:0 12px}

// ---------- backgrounds ----------
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeSkyline(){
  const c = document.createElement('canvas'); c.width = 480; c.height = 70;
  const x = c.getContext('2d'), r = rng(7);
  let px = 0;
  while (px < 480) {
    const w = 10 + r() * 22 | 0, h = 12 + r() * 30 | 0;
    if (px > 180 && px < 310) { px += w; continue; }
    x.fillStyle = '#132a52'; x.fillRect(px, 70 - h, w, h);
    x.fillStyle = 'rgba(255,211,77,.55)';
    for (let yy = 70 - h + 3; yy < 68; yy += 4)
      for (let xx = px + 2; xx < px + w - 2; xx += 3) if (r() < .25) x.fillRect(xx, yy, 1, 1);
    px += w + (r() * 4 | 0);
  }
  // A columned parliament-style building on a hill
  const bx = 200;
  x.fillStyle = '#1c3766';
  for (let s = 0; s < 4; s++) x.fillRect(bx - 4 - s * 3, 58 + s * 3, 98 + s * 6, 3);
  x.fillStyle = '#2d4f88'; x.fillRect(bx, 30, 90, 28); x.fillRect(bx + 10, 24, 70, 6);
  x.fillStyle = '#1c3766'; for (let i = 0; i < 14; i++) x.fillRect(bx + 7 + i * 6, 35, 2, 23);
  x.fillStyle = 'rgba(255,211,77,.7)'; x.fillRect(bx + 20, 27, 2, 1); x.fillRect(bx + 44, 27, 2, 1); x.fillRect(bx + 68, 27, 2, 1);
  return c;
}
function makeHills(){
  const c = document.createElement('canvas'); c.width = 640; c.height = 60;
  const x = c.getContext('2d'), r = rng(42);
  const top = [];
  for (let i = 0; i < 640; i++) {
    const h = 20 + Math.sin(i / 640 * Math.PI * 4) * 7 + Math.sin(i / 640 * Math.PI * 10) * 4;
    top[i] = 60 - h;
    x.fillStyle = '#b9cbe3'; x.fillRect(i, top[i], 1, h);
    x.fillStyle = '#e4edf8'; x.fillRect(i, top[i], 1, 2);
  }
  x.fillStyle = '#0e3a30';
  for (let n = 0; n < 34; n++) {
    const tx = r() * 640 | 0, th = 10 + r() * 12 | 0, base = top[tx] + 4;
    for (const ox of [0, -640, 640]) {
      for (let row = 0; row < th; row++) {
        const w = Math.max(1, Math.round(row * 0.55 * (row % 3 === 0 ? 0.8 : 1)));
        x.fillRect(tx + ox - (w >> 1), base - th + row, w, 1);
      }
      x.fillRect(tx + ox, base, 1, 2);
    }
  }
  return c;
}
function makeFarShore(){
  const c = document.createElement('canvas'); c.width = 480; c.height = 30;
  const x = c.getContext('2d');
  x.fillStyle = '#3d2f55';
  for (let i = 0; i < 480; i++) {
    const h = 9 + Math.sin(i / 480 * Math.PI * 6) * 3 + Math.sin(i / 480 * Math.PI * 16) * 2 + ((i % 7) < 3 ? 2 : 0) + ((i % 13) === 0 ? 3 : 0);
    x.fillRect(i, 30 - h, 1, h);
  }
  return c;
}
function makeIslands(){
  const c = document.createElement('canvas'); c.width = 640; c.height = 52;
  const x = c.getContext('2d'), r = rng(23);
  const isl = [[70, 70, 12], [250, 110, 15], [430, 60, 10], [560, 80, 13]];
  isl.forEach(([cx, w, rh], idx) => {
    for (let dx = -w / 2; dx <= w / 2; dx++) {
      const hh = Math.round(Math.sqrt(Math.max(0, 1 - (dx / (w / 2)) ** 2)) * rh);
      x.fillStyle = '#6e5b6f'; x.fillRect(cx + dx, 52 - hh, 1, hh);
      x.fillStyle = '#9a8090'; x.fillRect(cx + dx, 52 - hh, 1, 1);
    }
    x.fillStyle = '#22203a';
    const n = Math.floor(w / 9);
    for (let k = 0; k < n; k++) {
      const tx = Math.round(cx - w / 2 + 6 + k * (w - 12) / Math.max(1, n - 1)), th = 12 + r() * 14 | 0;
      const base = 52 - Math.round(Math.sqrt(Math.max(0, 1 - ((tx - cx) / (w / 2)) ** 2)) * rh) + 2;
      if (idx === 1 && Math.abs(tx - cx) < 22) continue;
      for (let row = 0; row < th; row++) { const ww = Math.max(1, Math.round(row * .5)); x.fillRect(tx - (ww >> 1), base - th + row, ww, 1); }
    }
    if (idx === 1) {
      const hx = cx - 14, hy = 52 - rh - 6;
      x.fillStyle = '#2a2f45'; x.fillRect(hx - 1, hy - 4, 18, 2); x.fillRect(hx + 1, hy - 6, 14, 2);
      x.fillStyle = '#a8352b'; x.fillRect(hx, hy - 2, 16, 8);
      x.fillStyle = '#f2f2ea'; x.fillRect(hx, hy - 2, 1, 8); x.fillRect(hx + 15, hy - 2, 1, 8);
      x.fillStyle = '#ffd34d'; x.fillRect(hx + 3, hy, 3, 3); x.fillRect(hx + 10, hy, 3, 3);
      x.fillStyle = '#a8352b'; x.fillRect(hx + 20, hy + 1, 9, 5);
      x.fillStyle = '#2a2f45'; x.fillRect(hx + 19, hy - 1, 11, 2);
      x.fillStyle = '#6b6f80'; x.fillRect(hx + 26, hy - 4, 2, 3);
      x.fillStyle = '#7a4e28'; x.fillRect(cx - 50, 47, 26, 2); x.fillRect(cx - 48, 49, 1, 3); x.fillRect(cx - 30, 49, 1, 3);
    }
  });
  return c;
}

// ---------- audio ----------
let actx = null, muted = false;
function ensureAudio(){ if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (actx && actx.state === 'suspended') actx.resume(); }
function beep(f, d, type='square', vol=.04, slide=0){
  if (!actx || muted) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d);
}

function T(s, x, y, size, col='#fff', al='left', bold=false, sh='#0a1530'){
  ctx.font = `${bold ? 700 : 400} ${size}px ${FONT}`;

}

// ---------- input ----------
const keys = {};
let touching = false, tx = 0, ty = 0;
addEventListener('keydown', e => {
  keys[e.code] = true; ensureAudio();
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && canStart()) advance();
  if (e.code === 'KeyP' && (state === 'play' || state === 'boss')) paused = !paused;
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function setTouch(e){ const r = cv.getBoundingClientRect(); tx = (e.clientX - r.left) / r.width * W; ty = (e.clientY - r.top) / r.height * H; }
cv.addEventListener('pointerdown', e => { ensureAudio(); cv.focus(); if (canStart()) { advance(); return; } touching = true; setTouch(e); });
cv.addEventListener('pointermove', e => { if (touching) setTouch(e); });
['pointerup','pointercancel','pointerleave'].forEach(n => cv.addEventListener(n, () => { touching = false; }));
document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'play' || state === 'boss')) paused = true; });

// ---------- game state ----------
let level = 1, levelStartScore = 0;
let state = 'title', stateT = 0, paused = false;
let schedule = [], groups = {}, gidN = 0, evs = [];
let p, bullets, enemies, ebullets, powerups, parts, floats, banner, boss, score, lt, spawnT, shake, scroll, birches;

function canStart(){ return state === 'title' || ((state === 'over' || state === 'win' || state === 'inter') && stateT > 0.8); }
function advance(){ if (state === 'inter') startLevel(2, false); else if (state === 'over') retry(); else startGame(); }
function startGame(){ startLevel(1, true); }
function retry(){ score = levelStartScore; p.lives = 3; startLevel(level, false); }
function startLevel(n, fresh){
  level = n;
  if (fresh || !p) { score = 0; p = {lives:3}; }
  Object.assign(p, {x:30, y:80, inv:1.5, cd:0, triple:0, speed:0, shield:0, smoke:0});
  levelStartScore = score;
  bullets = []; enemies = []; ebullets = []; powerups = []; parts = []; floats = [];
  boss = null; lt = 0; spawnT = 1.5; groups = {}; evs = []; shake = 0; paused = false; birches = [];
  schedule = LV[n].sched();
  setState('play');
  showBanner(LV[n].title, LV[n].sub, 3);
  beep(440, .12, 'square', .05, 220); setTimeout(() => beep(660, .15, 'square', .05, 220), 120);
}
function setState(s){ state = s; stateT = 0; }
function showBanner(text, sub='', dur=2.2){ banner = {text, sub, t:0, dur}; }

}

function spawn(type, y = 14 + Math.random() * (H - 40)){
  const R = Math.random;
  let e = {type, x:W + 8, y, t:0, flash:0};
  if (type === 'alv') Object.assign(e, {w:12, h:12, hp:3, vx:-40, vy:(R()-.5)*30, val:2500, col:C.yel});

      else {
        const A = Math.min(.8, .25 + ev.t * .06), th = A * Math.sin(ev.t * 1.6);
        ev.bx = px + L * Math.sin(th); ev.by = py + L * Math.cos(th);

    }
  }

}
function drawEnemy(e){
  const x = Math.round(e.x), y = Math.round(e.y);
  if (e.type === 'gull') ctx.drawImage(Math.floor(e.t * 6) % 2 ? SP.gullB : SP.gullA, x, y);
  if (e.type === 'letter') { ctx.drawImage(SP.letter, x, y); }
  if (e.type === 'ice' || e.type === 'ices') {
    const sz = e.type === 'ice' ? 12 : 6;
    ctx.fillStyle = '#7cc6ea'; ctx.fillRect(x, y, sz, sz);
    ctx.fillStyle = '#bfe9ff'; ctx.fillRect(x + 1, y + 1, sz - 2, sz - 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, y + 1, Math.max(1, sz / 4), 1); ctx.fillRect(x + 1, y + 1, 1, Math.max(1, sz / 4));
    if (sz === 12) T('€', x + 6, y + 2, 7, '#3a7fb0', 'center', true, null);
  }
  if (e.type === 'rig') {
    for (let r = 0; r < 20; r++) { const hw = Math.round(1 + r * 4 / 20); ctx.fillStyle = '#8a8f9c'; ctx.fillRect(x + 5 - hw, y + r, 1, 1); ctx.fillRect(x + 4 + hw, y + r, 1, 1); if (r % 5 === 4) ctx.fillRect(x + 5 - hw, y + r, hw * 2, 1); }
    ctx.fillStyle = Math.floor(gt * 3) % 2 ? '#ff3b4e' : '#5a1a20'; ctx.fillRect(x + 4, y - 1, 2, 1);
    ctx.fillStyle = '#c7ced9'; ctx.fillRect(x + 4 + (Math.floor(gt * 12) % 2), y + 20, 1, 3);
  }
  if (e.type === 'prop') {
    ctx.fillStyle = '#555b66'; ctx.fillRect(x + 2, y + 2, 3, 3);
    ctx.fillStyle = '#c7ced9'; if (Math.floor(gt * 18) % 2) ctx.fillRect(x + 3, y, 1, 7); else ctx.fillRect(x, y + 3, 7, 1);
  }
  if (e.type === 'gondola') {
    ctx.fillStyle = '#4a505c'; ctx.fillRect(x + 4, y - 1, 1, 2); ctx.fillRect(x + 15, y - 1, 1, 2);
    ctx.fillStyle = '#6b7180'; ctx.fillRect(x, y + 1, 20, 7);
    ctx.fillStyle = '#ffd34d'; for (let i = 0; i < 4; i++) ctx.fillRect(x + 2 + i * 5, y + 3, 3, 2);
  }
  if (e.type === 'folder') { ctx.fillStyle = '#c8962e'; ctx.fillRect(x, y, 4, 1); ctx.fillStyle = '#e0b04a'; ctx.fillRect(x, y + 1, 9, 6); ctx.fillStyle = '#fff'; ctx.fillRect(x + 2, y + 3, 5, 1); }
  if (e.type === 'fan') {
    ctx.fillStyle = '#6b7180'; ctx.fillRect(x, y, 18, 7);
    ctx.fillStyle = '#22262f'; ctx.fillRect(x + 4, y + 1, 10, 5);
    ctx.fillStyle = '#c7ced9';
    if (Math.floor(gt * 16) % 2) ctx.fillRect(x + 5, y + 3, 8, 1); else ctx.fillRect(x + 8, y + 1, 2, 5);
  }
  if (e.type === 'cab') {
    ctx.fillStyle = C.yel; ctx.fillRect(x, y, 14, 10);
    ctx.fillStyle = '#7fb7e6'; ctx.fillRect(x + 2, y + 2, 6, 4);
    ctx.fillStyle = '#8a6a10'; ctx.fillRect(x, y + 9, 14, 1);
  }
  if (e.type === 'case') {
    ctx.fillStyle = '#4a2e16'; ctx.fillRect(x + 6, y, 6, 1); ctx.fillRect(x + 6, y, 1, 3); ctx.fillRect(x + 11, y, 1, 3);
    ctx.fillStyle = '#7a4e28'; ctx.fillRect(x, y + 3, 18, 10);
    ctx.fillStyle = '#d8b04a'; ctx.fillRect(x + 8, y + 5, 2, 2);
    T('Selvitys', x + 9, y + 7.6, 3.2, '#f2e3c0', 'center', true, null);
  }
  if (e.type === 'plane') ctx.drawImage(Math.floor(e.t * 7) % 2 ? SP.planeShut : SP.plane, x, y);
  if (e.type === 'form') ctx.drawImage(SP.form, x, y);
  if (e.type === 'minister') {
    ctx.drawImage(SP.minister, x, y);
    if (e.say > 0) {
      const line = MIN_LINES[e.sayI]; ctx.font = `700 4.5px ${FONT}`;
      const tw = Math.ceil(ctx.measureText(line).width) + 6, bx2 = Math.max(2, x - tw + 6), by2 = y - 11;
      ctx.fillStyle = '#fff'; ctx.fillRect(bx2, by2, tw, 8); ctx.fillRect(x + 1, by2 + 8, 2, 2);
      T(line, bx2 + 3, by2 + 1.6, 4.5, C.red, 'left', true, null);
    }
  }
  if (e.type === 'train') { ctx.drawImage(e.part === 'loco' ? SP.loco : SP.car, x, y);
    if (e.part === 'loco') T('1 h', x + 15, y - 0.2, 3.4, C.red, 'center', true, null); }
  if (e.type === 'alv') { ctx.drawImage(SP.alv, x, y); T('%', x + 6, y + 1.5, 8, C.ink, 'center', true, null); }
  if (e.type === 'alvs') { ctx.drawImage(SP.alv, x, y, 7, 7); T('+1,5', x + 3.5, y + 1.6, 3.2, C.ink, 'center', true, null); }
  if (e.flash > 0) { ctx.globalAlpha = .6; ctx.fillStyle = '#fff'; ctx.fillRect(x, y, e.w, e.h); ctx.globalAlpha = 1; }
}
function drawBoss(){ if (boss.kind === 'kraken') drawKraken(); else drawPenBoss(); }
function drawTentacle(tx, top, bottom, wob){
  for (let y = Math.round(top); y < bottom; y += 2) {
    const ox = Math.round(Math.sin(y * .12 + gt * 4 + wob) * 2);
    ctx.fillStyle = '#7b4fb0'; ctx.fillRect(tx - 4 + ox, y, 9, 2);
    if (y % 6 === 0) { ctx.fillStyle = '#d9a8ff'; ctx.fillRect(tx - 4 + ox, y, 2, 1); }
  }
  ctx.fillStyle = '#7b4fb0'; ctx.fillRect(Math.round(tx - 2), Math.round(top) - 3, 5, 3); ctx.fillRect(Math.round(tx + 1), Math.round(top) - 5, 3, 2);
}
function drawKraken(){
  const b = boss, x = Math.round(b.x), y = Math.round(b.y);
  for (const tn of b.tents) {
    if (tn.t < .9) { if (Math.floor(tn.t * 10) % 2 === 0) { ctx.fillStyle = 'rgba(217,234,255,.8)'; for (let i = -6; i <= 6; i += 3) ctx.fillRect(Math.round(tn.x + i), 130 + (i & 1), 2, 1); ctx.fillRect(Math.round(tn.x) - 1, 127, 2, 2); } }
    else drawTentacle(tn.x, tn.tip, 180, tn.x);
  }
  if (b.dead && Math.floor(b.deadT * 10) % 2) return;
  drawTentacle(x - 4, y + 30, 180, 1); drawTentacle(x + 50, y + 26, 180, 2);
  drawTentacle(x + 12, y + 50, 180, 3); drawTentacle(x + 34, y + 50, 180, 4);
  ctx.fillStyle = '#f4f2ea'; ctx.fillRect(x, y, 46, 54);
  ctx.fillStyle = '#d8d4c4'; for (let i = 0; i < 8; i++) ctx.fillRect(x + 38 + i, y, 8 - i, 1 + i);
  ctx.fillStyle = '#b8b4a6'; ctx.fillRect(x + 38, y, 1, 8); ctx.fillRect(x + 38, y + 8, 8, 1);
  T('Hallitusohjelma', x + 20, y + 2, 3.4, '#1d3b6b', 'center', true, null);
  ctx.fillStyle = C.ink; ctx.fillRect(x + 8, y + 11, 9, 6); ctx.fillRect(x + 25, y + 11, 9, 6);
  ctx.fillStyle = C.red; ctx.fillRect(x + 9, y + 13, 3, 3); ctx.fillRect(x + 26, y + 13, 3, 3);
  ctx.fillStyle = C.ink; ctx.fillRect(x + 7, y + 8, 5, 1); ctx.fillRect(x + 12, y + 9, 5, 1); ctx.fillRect(x + 25, y + 9, 5, 1); ctx.fillRect(x + 30, y + 8, 5, 1);
  ctx.fillStyle = '#9fa6b2'; for (let r = 0; r < 4; r++) ctx.fillRect(x + 6, y + 22 + r * 4, 34 - (r * 7) % 13, 1);
  ctx.fillStyle = C.ink; for (let i = 0; i < 24; i += 2) ctx.fillRect(x + 10 + i, y + 41 + ((i / 2) % 2) * 2, 2, 1);
  T('s. 214', x + 40, y + 48, 3.2, '#6b707c', 'right', false, null);
  if (b.flash > 0) { ctx.globalAlpha = .5; ctx.fillStyle = '#fff'; ctx.fillRect(x, y, 46, 54); ctx.globalAlpha = 1; }
}
function drawPenBoss(){
  const b = boss, bx = Math.round(b.x), by = Math.round(b.y);
  if (b.laser) {
    const ly = Math.round(b.laser.y);
    if (b.laser.t < .9) {
      if (Math.floor(b.laser.t * 12) % 2 === 0) { ctx.fillStyle = 'rgba(255,60,80,.7)'; for (let x = 0; x < bx; x += 6) ctx.fillRect(x, ly, 3, 1); }
    } else {
      ctx.fillStyle = C.red; ctx.fillRect(0, ly - 2, bx, 5);
      ctx.fillStyle = '#ffd6da'; ctx.fillRect(0, ly, bx, 1);
    }
  }
  if (b.dead && Math.floor(b.deadT * 10) % 2) return;
  ctx.fillStyle = C.ink; ctx.fillRect(bx, by + 10, 4, 2);
  ctx.fillStyle = '#b8c0cc';
  for (let i = 0; i < 8; i++) { const hgt = Math.round(i * 1.6) + 2; ctx.fillRect(bx + 4 + i, by + 11 - (hgt >> 1), 1, hgt); }
  ctx.fillStyle = C.red; ctx.fillRect(bx + 12, by + 3, 42, 16);
  ctx.fillStyle = '#ff5a66'; ctx.fillRect(bx + 12, by + 5, 42, 2);
  ctx.fillStyle = C.trim; ctx.fillRect(bx + 52, by + 3, 3, 16);
  ctx.fillStyle = C.redD; ctx.fillRect(bx + 55, by + 2, 10, 18);
  ctx.fillStyle = '#c0c6d0'; ctx.fillRect(bx + 40, by, 22, 2); ctx.fillRect(bx + 40, by + 2, 2, 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(bx + 20, by + 8, 6, 5); ctx.fillRect(bx + 30, by + 8, 6, 5);
  ctx.fillStyle = C.ink; ctx.fillRect(bx + 21, by + 9, 2, 3); ctx.fillRect(bx + 31, by + 9, 2, 3);
  ctx.fillRect(bx + 19, by + 6, 4, 1); ctx.fillRect(bx + 23, by + 7, 3, 1);
  ctx.fillRect(bx + 30, by + 7, 3, 1); ctx.fillRect(bx + 33, by + 6, 4, 1);
  ctx.fillRect(bx + 22, by + 15, 12, 1); ctx.fillRect(bx + 21, by + 16, 1, 1); ctx.fillRect(bx + 34, by + 16, 1, 1);
  if (b.flash > 0) { ctx.globalAlpha = .5; ctx.fillStyle = '#fff'; ctx.fillRect(bx, by, 66, 20); ctx.globalAlpha = 1; }
}
function drawEBullet(b){
  if (!b.look) b.look = b.kind === 'para' || Math.random() < .5 ? 'para' : 'plane';
  if (b.look === 'para') { T('§', b.x - 1.6, b.y - 3, 5, '#ff4f7a', 'left', true, '#2a0a1a'); return; }
  ctx.save(); ctx.translate(Math.round(b.x), Math.round(b.y)); ctx.rotate(Math.atan2(b.vy, b.vx));
  ctx.drawImage(SP.miniPlane, -3, -2); ctx.restore();
}
function drawHUD(){
  T('Pelastetut etuudet: ' + euro(score), 4, 3, 6, '#fff', 'left', true);
  for (let i = 0; i < p.lives; i++) ctx.drawImage(SP.piirakka, W - 12 - i * 10, 4);
  if (state === 'play') {
    const bw = 80, bx = W / 2 - bw / 2 + 30;
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(bx, 12, bw, 3);
    ctx.fillStyle = '#7cf0b4'; ctx.fillRect(bx, 12, Math.round(bw * Math.min(1, lt / LV[level].len)), 3);
    T(LV[level].goal, bx + bw + 3, 10, 4, '#cfe0f7');
  } else if (boss) {
    const bw = 110, bx = W / 2 - bw / 2;
    T(boss.name, W / 2, 11, 4.5, '#ffb3ba', 'center', true);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(bx, 17, bw, 3);
    ctx.fillStyle = C.red; ctx.fillRect(bx, 17, Math.round(bw * Math.max(0, boss.hp) / boss.max), 3);
  }
  let iy = H - 12;
  for (const [k, icon, max] of [['triple','salmiakki',9], ['speed','kahvi',9], ['shield','sisu',10]]) {
    if (p[k] > 0) {
      ctx.drawImage(SP[icon], 4, iy);
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(14, iy + 3, 24, 2);
      ctx.fillStyle = '#fff'; ctx.fillRect(14, iy + 3, Math.round(24 * p[k] / max), 2);
      iy -= 10;
    }
  }
}
function drawBanner(){
  if (!banner) return;
  const a = Math.min(1, banner.t * 4, (banner.dur - banner.t) * 3);
  ctx.globalAlpha = Math.max(0, a);
  ctx.fillStyle = 'rgba(6,15,40,.6)'; ctx.fillRect(0, 40, W, banner.sub ? 26 : 16);
  T(banner.text, W / 2, 43, 7.5, '#fff', 'center', true);
  if (banner.sub) T(banner.sub, W / 2, 54, 5, '#cfe0f7', 'center');
  ctx.globalAlpha = 1;
}
function overlay(){ ctx.fillStyle = 'rgba(4,10,28,.72)'; ctx.fillRect(0, 0, W, H); }
const blink = () => Math.floor(gt * 2) % 2 === 0;

function drawTitle(){
  ctx.fillStyle = 'rgba(4,10,28,.45)'; ctx.fillRect(0, 0, W, H);
  T('SÄÄSTÖSANKARI', W / 2 + 1, 33, 20, C.blue, 'center', true, null);
  T('SÄÄSTÖSANKARI', W / 2, 32, 20, '#fff', 'center', true, '#0a1530');
  T('Pelasta etuutesi ennen seuraavaa budjettiriihtä.', W / 2, 60, 6, '#cfe0f7', 'center');
  ctx.drawImage(SP.player, W / 2 - 13, 76 + Math.round(Math.sin(gt * 3) * 2));
  T('Nuolet tai WASD: liiku', W / 2, 98, 5, '#fff', 'center');
  T('Välilyönti: heitä lahjoja', W / 2, 106, 5, '#fff', 'center');
  T('P: tauko   M: äänet', W / 2, 114, 5, '#fff', 'center');
  if (blink()) T('Paina välilyöntiä tai napauta aloittaaksesi', W / 2, 132, 6, '#ffd34d', 'center', true);
  T('Satiiri. Kaikki hahmot ovat kuvitteellisia.', W / 2, 160, 4, '#8fa3c2', 'center');
}
function drawOver(){
  overlay();
  T('Hakemuksesi on hylätty.', W / 2, 50, 12, '#ff6b78', 'center', true);
  T('Pelastetut etuudet: ' + euro(score), W / 2, 74, 6, '#fff', 'center');
  T('Voit hakea muutosta 30 päivän kuluessa.', W / 2, 86, 5, '#cfe0f7', 'center');
  T('Jatkat tasolta ' + level + '.', W / 2, 96, 5, '#cfe0f7', 'center');
  if (stateT > .8 && blink()) T('Paina välilyöntiä tai napauta hakeaksesi uudelleen', W / 2, 116, 5.5, '#ffd34d', 'center', true);
}
function drawInter(){
  overlay();
  T('Taso 1 läpäisty!', W / 2, 40, 14, '#7cf0b4', 'center', true);
  T('Punakynä kaatui, mutta hallitusohjelma elää yhä.', W / 2, 62, 5.5, '#cfe0f7', 'center');
  T('Pelastetut etuudet: ' + euro(score), W / 2, 76, 7, '#fff', 'center', true);
  T('Seuraavaksi: Taso 2, Saimaa', W / 2, 92, 6, '#ffb36b', 'center', true);
  if (stateT > .8 && blink()) T('Paina välilyöntiä tai napauta jatkaaksesi', W / 2, 118, 5.5, '#ffd34d', 'center', true);
}
function drawWin(){
  overlay();
  T('Peli läpäisty!', W / 2, 40, 14, '#7cf0b4', 'center', true);
  T('Hallitusohjelma upposi Saimaaseen.', W / 2, 62, 5.5, '#cfe0f7', 'center');
  T('Etuutesi tarkistetaan seuraavassa budjettiriihessä.', W / 2, 72, 5.5, '#cfe0f7', 'center');
  T('Pelastetut etuudet: ' + euro(score), W / 2, 84, 7, '#fff', 'center', true);
  T('Kiitos osallistumisesta talkoisiin.', W / 2, 96, 5, '#cfe0f7', 'center');
  if (stateT > .8 && blink()) T('Paina välilyöntiä tai napauta pelataksesi uudelleen', W / 2, 120, 5.5, '#ffd34d', 'center', true);
}

function draw(){
  const sx = shake > 0 ? (Math.random() - .5) * 4 : 0, sy = shake > 0 ? (Math.random() - .5) * 4 : 0;
  ctx.setTransform(S, 0, 0, S, sx * S, sy * S);
  ctx.imageSmoothingEnabled = false;
  drawBackground();
  if (state === 'title') { for (const s of snow) { ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(s.x | 0, s.y | 0, 1, 1); } drawTitle(); return; }
  drawBirches();
  for (const q of parts) if (q.smoke) { ctx.globalAlpha = .5 * (1 - q.t / q.dur); ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); }
  ctx.globalAlpha = 1;
  drawEvents();
  for (const u of powerups) ctx.drawImage(SP[u.type], Math.round(u.x), Math.round(u.y + Math.sin(u.t * 5) * 2));
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss();
  ctx.fillStyle = '#ffffff';
  for (const b of bullets) { const bx = Math.round(b.x) - 2, by = Math.round(b.y) - 2; ctx.globalAlpha = 1; ctx.fillStyle = '#d0202f'; ctx.fillRect(bx, by, 4, 4); ctx.fillStyle = '#ffd34d'; ctx.fillRect(bx + 1, by, 1, 4); ctx.fillRect(bx, by + 1, 4, 1); ctx.fillRect(bx, by - 1, 1, 1); ctx.fillRect(bx + 2, by - 1, 1, 1); }
  ctx.globalAlpha = 1;
  for (const b of ebullets) drawEBullet(b);
  if (state !== 'over') drawPlayer();
  for (const q of parts) if (!q.smoke) { ctx.globalAlpha = 1 - q.t / q.dur; ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), q.paper ? 3 : 2, 2); }
  ctx.globalAlpha = 1;
  for (const s of snow) { ctx.fillStyle = level === 2 ? 'rgba(255,225,170,.55)' : 'rgba(255,255,255,.75)'; ctx.fillRect(s.x | 0, s.y | 0, 1, 1); }
  for (const f of floats) { ctx.globalAlpha = 1 - f.t / f.dur; T(f.s, Math.round(f.x), Math.round(f.y), f.size, f.col, 'left', true); }
  ctx.globalAlpha = 1;
  drawHUD();
  drawBanner();
  if (paused) { overlay(); T('Tauko', W / 2, 70, 14, '#fff', 'center', true); T('Paina P jatkaaksesi', W / 2, 92, 6, '#cfe0f7', 'center'); }
  if (state === 'over') drawOver();
  if (state === 'win') drawWin();
  if (state === 'inter') drawInter();
}

// ---------- loop ----------
scroll = 0; parts = []; floats = []; bullets = []; enemies = []; ebullets = []; powerups = []; birches = [];
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; gt += dt;
  update(dt);
  if (!paused) updateFx(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

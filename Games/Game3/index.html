<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syvä kuilu – pelastuslento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --frame:#6C5EB5; --screen:#352879; --ink:#ffffff; --muted:#e4dfff; --keybg:#40318D; --keyline:#a79cf0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --frame:#231c52; --screen:#0f0b2a; --muted:#b9b0f0; --keybg:#352879; --keyline:#6C5EB5; }
}
:root[data-theme="dark"]{ --frame:#231c52; --screen:#0f0b2a; --muted:#b9b0f0; --keybg:#352879; --keyline:#6C5EB5; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--frame);color:var(--ink);
  font-family:'Silkscreen',ui-monospace,'Courier New',monospace;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
main{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px;max-width:100%}
.screen{background:#000;padding:0;line-height:0;box-shadow:0 0 0 6px var(--screen)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px #fff}
.help{font-size:12px;line-height:1.9;color:var(--muted);text-align:center;max-width:62ch;margin:0}
kbd{font-family:inherit;font-size:11px;background:var(--keybg);border:1px solid var(--keyline);padding:1px 6px;margin:0 2px;color:#fff}
.pad{display:none;width:min(100%,520px);justify-content:space-between;align-items:center;gap:12px}
.pad.on{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,52px);gap:6px}
.pad button{
  font-family:inherit;font-size:12px;color:#fff;background:var(--keybg);border:2px solid var(--keyline);
  touch-action:none;-webkit-tap-highlight-color:transparent;
}
.pad button.down{background:var(--keyline);color:#000}
.b-up{grid-column:2;grid-row:1}.b-left{grid-column:1;grid-row:2}.b-down{grid-column:2;grid-row:2}.b-right{grid-column:3;grid-row:2}
.acts{display:flex;flex-direction:column;gap:8px}
.acts button{width:110px;height:52px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>
<main>
  <h1 class="sr">Syvä kuilu – pelastuslento</h1>
  <div class="screen"><canvas id="game" width="320" height="268" tabindex="0" aria-label="Pelialue. Aloita välilyönnillä."></canvas></div>
  <div class="pad" id="pad" aria-label="Kosketusohjaimet">
    <div class="dpad">
      <button class="b-up" data-k="up" aria-label="Roottori ylös">▲</button>
      <button class="b-left" data-k="left" aria-label="Vasemmalle">◀</button>
      <button class="b-down" data-k="down" aria-label="Alas">▼</button>
      <button class="b-right" data-k="right" aria-label="Oikealle">▶</button>
    </div>
    <div class="acts">
      <button data-k="fire">Laser</button>
      <button data-k="bomb">Dynamiitti</button>
    </div>
  </div>
  <p class="help" id="help">
    <kbd>←</kbd><kbd>→</kbd> liiku &nbsp; <kbd>↑</kbd> roottori &nbsp; <kbd>↓</kbd> laskeudu tai pudota dynamiitti maassa<br>

  </p>
</main>

// ---------- audio ----------
let ac=null, muted=false;
function initAudio(){ if(ac) return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
function beep(f,d,type,vol,slide){
  if(!ac||muted) return;
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.02);
}
function noise(d,vol){
  if(!ac||muted) return;
  const n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), a=b.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; g.gain.value=vol||0.2;
  s.connect(g); g.connect(ac.destination); s.start();
}
function jingle(notes,step){ notes.forEach((f,i)=>setTimeout(()=>beep(f,step/1000*0.9,'square',0.05),i*step)); }

// ---------- input ----------
const keys={}, prev={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',
  ArrowDown:'down',KeyS:'down',Space:'fire',KeyZ:'fire',KeyK:'fire',KeyX:'bomb',KeyL:'bomb',
  Enter:'start',KeyP:'pause',Escape:'pause',KeyM:'mute'};
addEventListener('keydown',e=>{ const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); initAudio(); keys[k]=true; });
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); keys[k]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; if(state==='play') state='paused'; });
function pressed(k){ return keys[k] && !prev[k]; }
let tap=false;
cv.addEventListener('pointerdown',()=>{ initAudio(); tap=true; cv.focus(); });

const pad=document.getElementById('pad');
const coarse=window.matchMedia && matchMedia('(pointer: coarse)').matches;
if(coarse){ pad.classList.add('on'); document.getElementById('help').style.display='none'; }
pad.querySelectorAll('button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{ e.preventDefault(); initAudio(); keys[k]=true; b.classList.add('down'); try{b.setPointerCapture(e.pointerId)}catch(_){} };
  const off=e=>{ e.preventDefault(); keys[k]=false; b.classList.remove('down'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

// ---------- scaling ----------
function fit(){
  const padH = pad.classList.contains('on') ? pad.offsetHeight+14 : 0;
  const helpEl=document.getElementById('help');
  const helpH = helpEl.style.display==='none' ? 0 : helpEl.offsetHeight+14;
  const aw=window.innerWidth-36, ah=window.innerHeight-padH-helpH-48;
  let s=Math.min(aw/VW, ah/(VH+HUD));
  s = s>=2 ? Math.floor(s) : Math.max(0.8,s);
  cv.style.width=Math.round(VW*s)+'px'; cv.style.height=Math.round((VH+HUD)*s)+'px';
}
addEventListener('resize',fit); fit();

function energyMax(){ const L=LEVELS[levelIdx%LEVELS.length]; return Math.round((L.energy||90)*60*Math.pow(0.9,loop)); }
function tile(x,y){ if(y<0||y>=rows||x<0||x>=cols) return '#'; return grid[y][x]; }
function setTile(x,y,c){ if(y>=0&&y<rows&&x>=0&&x<cols) grid[y][x]=c; }
function isSolid(c){ return c==='#'||c==='W'||c==='L'; }

// ---------- pixel-texture generation (C64-style dithering) ----------
let levelCv=null, wallCv=null, lavaCv=null, waterCv=null, titleCv=null, popups=[];
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function h32(x,y,s){ let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1103515245))|0;
  h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
function rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function blot(px,py,cw,ch,rx,ry,seed){
  const cx0=Math.floor(px/cw), cy0=Math.floor(py/ch);
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const cx=cx0+dx, cy=cy0+dy; if(h32(cx,cy,seed)<0.3) continue;
    const ex=(cx+h32(cx,cy,seed+1))*cw, ey=(cy+h32(cx,cy,seed+2))*ch, r=rx*(0.55+h32(cx,cy,seed+3)*0.9);
    const u=(px-ex)/r, v=(py-ey)/ry; if(u*u+v*v<1) return true;
  }
  return false;
}
function edgeDist(lx,ly,o){
  let d=99; const E=T-1, Rr=6;
  if(o.t) d=Math.min(d,ly); if(o.b) d=Math.min(d,E-ly); if(o.l) d=Math.min(d,lx); if(o.r) d=Math.min(d,E-lx);
  if(o.t&&o.l&&lx<Rr&&ly<Rr) d=Math.min(d,Rr-Math.hypot(Rr-lx,Rr-ly));
  if(o.t&&o.r&&lx>E-Rr&&ly<Rr) d=Math.min(d,Rr-Math.hypot(lx-(E-Rr),Rr-ly));
  if(o.b&&o.l&&lx<Rr&&ly>E-Rr) d=Math.min(d,Rr-Math.hypot(Rr-lx,ly-(E-Rr)));
  if(o.b&&o.r&&lx>E-Rr&&ly>E-Rr) d=Math.min(d,Rr-Math.hypot(lx-(E-Rr),ly-(E-Rr)));
  return d;
}
let NZ=null, BL=null; const PW=640, PH=384;
function ensureTables(){
  if(NZ) return; NZ=new Float32Array(PW*PH); BL=new Uint8Array(PW*PH);
  for(let y=0;y<PH;y++) for(let x=0;x<PW;x++){ const i=y*PW+x; NZ[i]=h32(x,y,1); BL[i]=blot(x,y,27,11,10,2.3,11)?1:0; }
}
function buildCave(nc,nr,solidAt,openAt,th,usedScreen){
  ensureTables();
  const W=nc*T,H=nr*T, out=mkCanvas(W,H), c2=out.getContext('2d'), img=c2.createImageData(W,H), D=img.data;
  const dot=rgb(th.dot), BLK=[0,0,0], bands=th.bands.map(b=>({to:b.to,c1:rgb(b.c1),c2:rgb(b.c2)}));
  const set=(x,y,c)=>{ if(x<0||y<0||x>=W||y>=H) return; const i=(y*W+x)*4; D[i]=c[0];D[i+1]=c[1];D[i+2]=c[2];D[i+3]=255; };
  const bg=(px,py)=> (px%4===((py>>1)%2)*2 && py%3===0 && h32(px>>2,py,3)<0.5) ? dot : BLK;
  for(let ty=0;ty<nr;ty++) for(let tx=0;tx<nc;tx++){
    if(usedScreen && !usedScreen(Math.floor(tx/SW),Math.floor(ty/SH))) continue;
    const solid=solidAt(tx,ty);
    const o=solid?{t:openAt(tx,ty-1),b:openAt(tx,ty+1),l:openAt(tx-1,ty),r:openAt(tx+1,ty)}:null;
    const band=bands.find(b=>(ty%SH)<=b.to)||bands[bands.length-1];
    for(let ly=0;ly<T;ly++) for(let lx=0;lx<T;lx++){
      const px=tx*T+lx, py=ty*T+ly;
      if(!solid){ set(px,py,bg(px,py)); continue; }
      const d=edgeDist(lx,ly,o), j=0.5+h32((o.t||o.b)?px>>1:py>>1,ty*31+tx,5)*2.6;
      if(d<j){ set(px,py,bg(px,py)); continue; }
      const ti=(py%PH)*PW+(px%PW), n=NZ[ti];
      if(d<j+1.8 && n<0.5){ set(px,py,BLK); continue; }
      let c;
      if(BL[ti]) c = n<0.75?BLK:band.c2;
      else c = n<0.5?band.c1 : n<0.8?band.c2 : BLK;
      set(px,py,c);
    }
  }
  if(th.moss){
    const g1=rgb('#94E089'), g2=rgb('#55A049');
    for(let ty=0;ty<nr;ty++) for(let tx=0;tx<nc;tx++){
      if(usedScreen && !usedScreen(Math.floor(tx/SW),Math.floor(ty/SH))) continue;
      if(!solidAt(tx,ty)) continue;
      if(openAt(tx,ty-1)) for(let lx=0;lx<T;lx++){ const px=tx*T+lx, top=ty*T;
        const mh=4+Math.floor(h32(px>>1,ty,21)*4);
        for(let k=0;k<mh;k++){ const py=top+k+1; if(h32(px,py,22)<0.8) set(px,py,h32(px,py,23)<0.65?g1:g2); }
        if(h32(px>>1,ty,24)<0.2){ const sh=2+Math.floor(h32(px>>1,ty,25)*8); for(let k=0;k<sh;k++) if(h32(px,k,26)<0.85) set(px,top-k,g1); }
      }
      if(openAt(tx,ty+1)) for(let lx=0;lx<T;lx++){ const px=tx*T+lx, bot=ty*T+T-1;
        for(let k=0;k<5;k++) if(h32(px,bot-k,27)<0.8) set(px,bot-k,k<3?g1:g2);
        if(h32(px>>1,ty,28)<0.3){ const sh=3+Math.floor(h32(px>>1,ty,29)*12); for(let k=0;k<sh;k++) if(h32(px,k,30)<0.85-k*0.03) set(px,bot+k,k<sh*0.5?g1:g2); }
      }
    }
  }
  c2.putImageData(img,0,0); return out;
}
function buildDither(W,H,frames,cA,cB,cC,pC,vertical,seed){
  const out=mkCanvas(W,H*frames), c2=out.getContext('2d'), img=c2.createImageData(W,H*frames), D=img.data;
  const A=rgb(cA),B=rgb(cB),Cc=rgb(cC),BLK=[0,0,0];
  for(let f=0;f<frames;f++) for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const yy=y+f*3, n=h32(x,(yy%H),seed+f*7);
    const b= vertical ? blot(y,x,22,7,7,1.5,seed+2) : blot(x,(yy%H),20,8,7,1.6,seed+2);
    const c = b ? (n<0.7?BLK:B) : (n<pC?Cc : n<0.55?A : n<0.85?B : BLK);
    const i=((y+f*H)*W+x)*4; D[i]=c[0];D[i+1]=c[1];D[i+2]=c[2];D[i+3]=255;
  }
  c2.putImageData(img,0,0); return out;
}
function buildLevelGfx(){
  const solidAt=(x,y)=>tile(x,y)==='#';
  const openAt=(x,y)=>!'#WL'.includes(tile(x,y));
  const used={};
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) if(grid[y][x]!=='#') used[Math.floor(x/SW)+','+Math.floor(y/SH)]=1;
  levelCv=buildCave(cols,rows,solidAt,openAt,theme,(sx,sy)=>used[sx+','+sy]);
  if(!wallCv) wallCv=buildDither(64,64,1,WALL1,WALL2,'#B86962',0.04,true,40);
  if(!lavaCv) lavaCv=buildDither(64,64,4,'#B86962','#883932','#BFCE72',0.08,false,60);
  if(!waterCv) waterCv=buildDither(64,64,4,'#40318D','#352879','#6C5EB5',0.12,false,80);
}
function getTitleCv(){
  if(titleCv) return titleCv;
  const sol=(x,y)=> y>=10 || (x<3&&y>=6) || (x>=17&&y>=4) || y<0 || x<0 || x>=SW;
  titleCv=buildCave(SW,SH,(x,y)=>x>=0&&y>=0&&x<SW&&y<SH&&sol(x,y),(x,y)=>!(sol(x,y)||y>=SH),THEMES[0]);
  return titleCv;
}
function boxAny(o,pad,fn){
  const x0=Math.floor((o.x-pad)/T), x1=Math.floor((o.x+o.w+pad-0.01)/T);
  const y0=Math.floor((o.y-pad)/T), y1=Math.floor((o.y+o.h+pad-0.01)/T);
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(fn(tile(x,y),x,y)) return true;
  return false;
}
function collides(o){ return boxAny(o,0,isSolid); }
function moveX(o,dx){
  if(!dx) return; o.x+=dx;
  if(collides(o)){ if(dx>0) o.x=Math.floor((o.x+o.w)/T)*T-o.w-0.01; else o.x=Math.floor(o.x/T)*T+T; o.vx=0; }
}
function moveY(o,dy){
  if(!dy) return; o.y+=dy;
  if(collides(o)){
    if(dy>0){ o.y=Math.floor((o.y+o.h)/T)*T-o.h-0.01; o.ground=true; }
    else o.y=Math.floor(o.y/T)*T+T;
    o.vy=0;
  }
}
function overlap(a,b,inset){ inset=inset||0;
  return a.x+inset<b.x+b.w-inset && a.x+a.w-inset>b.x+inset && a.y+inset<b.y+b.h-inset && a.y+a.h-inset>b.y+inset; }

function makeEnemy(type,tx,ty){
  const e={type,alive:true,t:0,phase:Math.random()*6.28,dir:Math.random()<0.5?-1:1};
  e.w = type==='N'?14:12; e.h = type==='N'?8:10;
  const cx=tx*T+T/2, cy=ty*T+T/2, scx=Math.floor(tx/SW), scy=Math.floor(ty/SH);
  e.ax=cx; e.ay=cy; e.x=cx-e.w/2; e.y=cy-e.h/2;
  const sp=Math.pow(1.15,loop);
  if(type==='S'){
    let top=ty; while(top-1>=scy*SH && !isSolid(tile(tx,top-1))) top--;
    let bot=ty; while(bot+1<(scy+1)*SH && !isSolid(tile(tx,bot+1))) bot++;
    e.top=top*T; e.minY=Math.max(top*T+2,cy-44); e.maxY=Math.min((bot+1)*T-e.h-2,cy+44); e.spd=0.03*sp;
  } else {
    let l=tx; while(l-1>=scx*SW && !isSolid(tile(l-1,ty))) l--;
    let r=tx; while(r+1<(scx+1)*SW && !isSolid(tile(r+1,ty))) r++;
    e.minX=l*T+1; e.maxX=(r+1)*T-e.w-1;
    e.spd=(type==='B'?0.9:0.65)*sp;
    if(type==='N') e.dir = (cx-e.minX)>(e.maxX-cx)?-1:1;
  }
  return e;
}

function loadLevel(){
  const L=LEVELS[levelIdx%LEVELS.length];
  theme=THEMES[L.theme];
  grid=L.map.map(r=>r.split('')); rows=grid.length; cols=grid[0].length;
  enemies=[]; wallHP={}; particles=[]; dyn=null; miner=null; laser=null;
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const c=grid[y][x];
    if(c==='P'){ start={x:x*T+3,y:y*T+1.99}; grid[y][x]=' '; }
    else if(c==='M'){ miner={x:x*T+3,y:y*T+2,w:10,h:14}; grid[y][x]=' '; }
    else if('SBON'.includes(c)){ enemies.push(makeEnemy(c,x,y)); grid[y][x]=' '; }
  }
  const u=Math.floor((levelIdx%LEVELS.length)/4)*4;
  if(u>unlocked){ unlocked=u; try{localStorage.setItem('syvakuilu-unlock',String(u))}catch(e){} }
  buildLevelGfx(); popups=[];
  bombs=6; energy=energyMax();
  placePlayer(start); checkpoint={x:start.x,y:start.y};
  banner=120; state='play';
}
function placePlayer(pos){
  Object.assign(player,{x:pos.x,y:pos.y,vx:0,vy:0,ground:false,spin:0,inv:90});
  curSX=Math.floor((player.x+player.w/2)/VW); curSY=Math.floor((player.y+player.h/2)/VH); dark=false;
}
function newGame(){ score=0; lives=4; levelIdx=Math.min(startSel,unlocked); loop=0; nextLife=20000; loadLevel(); }

function addScore(n){ score+=n; if(score>=nextLife){ lives++; nextLife+=20000; jingle([660,880,1320],80); } }
function burst(x,y,n,colors,spd){
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, v=Math.random()*(spd||2.5);
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:30+Math.random()*30,c:colors[i%colors.length]}); }
}
function destroyColumn(tx,ty){
  let y=ty; while(tile(tx,y-1)==='W') y--;
  let n=0;
  while(tile(tx,y)==='W'){ setTile(tx,y,' '); delete wallHP[tx+','+y]; burst(tx*T+8,y*T+8,6,[WALL1,WALL2,C.white],2); y++; n++; }
  if(n){ addScore(75); popups.push({x:tx*T+8,y:(y-1)*T,t:'75',life:50}); }
}
function killEnemy(e){ e.alive=false; addScore(50); popups.push({x:e.x+e.w/2+14,y:e.y,t:'50',life:50}); burst(e.x+e.w/2,e.y+e.h/2,12,[C.white,C.yellow,C.lred],2.2); beep(300,0.15,'square',0.05,-250); }

function die(){
  if(state!=='play') return;
  state='dying'; timer=80; laser=null;
  burst(player.x+5,player.y+7,24,[C.yellow,C.cyan,C.white,C.lred],3);
  beep(600,0.7,'sawtooth',0.06,-560);
}
function explode(d){
  const cx=d.x+2, cy=d.y+5;
  for(let ty=Math.floor((cy-26)/T); ty<=Math.floor((cy+26)/T); ty++)
    for(let tx=Math.floor((cx-34)/T); tx<=Math.floor((cx+34)/T); tx++)
      if(tile(tx,ty)==='W' && Math.abs(tx*T+8-cx)<=30 && Math.abs(ty*T+8-cy)<=22) destroyColumn(tx,ty);
  enemies.forEach(e=>{ if(e.alive && Math.hypot(e.x+e.w/2-cx,e.y+e.h/2-cy)<40) killEnemy(e); });
  const pdx=Math.abs(player.x+5-cx), pdy=Math.abs(player.y+7-cy);
  if(state==='play' && pdx<30 && pdy<26) die();
  flash=12; noise(0.6,0.35); beep(80,0.5,'square',0.08,-50);
  burst(cx,cy,30,[C.yellow,C.white,C.lred,C.orange],3.5);
}

// ---------- update ----------
function updateEnemies(){
  enemies.forEach(e=>{
    if(!e.alive) return; e.t++;
    if(e.type==='S'){ e.y=e.minY+(e.maxY-e.minY)*(0.5+0.5*Math.sin(e.t*e.spd+e.phase)); }
    else if(e.type==='N'){ e.x=e.ax-e.w/2+e.dir*(3+3*Math.sin(e.t*0.09+e.phase)); }
    else {
      e.x+=e.dir*e.spd; if(e.x<e.minX){e.x=e.minX;e.dir=1;} if(e.x>e.maxX){e.x=e.maxX;e.dir=-1;}
      const amp=e.type==='O'?7:3, f=e.type==='O'?0.08:0.15;
      e.y=e.ay-e.h/2+Math.sin(e.t*f+e.phase)*amp;
    }
  });
}
function updateParticles(){
  particles=particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life--; return p.life>0; });
  popups=popups.filter(p=>{ p.y-=0.25; p.life--; return p.life>0; });
}

function update(){
  frame++;
  if(pressed('mute')){ muted=!muted; }
  const go = pressed('start')||pressed('fire')||tap;
  tap=false;
  if(flash>0) flash--;
  if(state==='title'){
    if(pressed('left')) startSel=Math.max(0,startSel-4);
    if(pressed('right')) startSel=Math.min(unlocked,startSel+4);
    if(go){ initAudio(); newGame(); } return; }
  if(state==='over'){ updateParticles(); if(timer>0) timer--; else if(go) state='title'; return; }
  if(state==='paused'){ if(pressed('pause')||go) state='play'; return; }
  if(state==='clear'){ updateClear(); updateParticles(); return; }
  if(state==='dying'){
    updateEnemies(); updateParticles(); timer--;
    if(timer<=0){
      lives--;
      if(lives<=0){ state='over'; timer=90; if(score>hi){hi=score;saveHi(hi);} jingle([392,330,262,196],180); }
      else { energy=energyMax(); dyn=null; placePlayer(checkpoint); state='play'; }
    }
    return;
  }
  // ---- play ----
  if(pressed('pause')){ state='paused'; return; }
  if(banner>0) banner--;
  const p=player;
  energy--; if(energy<=0){ energy=0; die(); return; }
  if(p.inv>0) p.inv--;

  if(keys.left){ p.vx=-1.5; p.face=-1; } else if(keys.right){ p.vx=1.5; p.face=1; } else p.vx=0;
  if(keys.up){ p.spin=Math.min(p.spin+1,30); if(p.spin>8) p.vy-=0.32; if(frame%5===0) beep(60+p.spin*3,0.06,'square',0.018); }
  else p.spin=Math.max(0,p.spin-2);
  p.anim += p.spin>8?1:(p.spin>0?0.5:0);
  p.vy+= keys.up ? 0.16 : 0.10; if(keys.down && !p.ground) p.vy+=0.12;
  p.vy=Math.max(-2,Math.min(keys.down?3:2.6,p.vy));
  moveX(p,p.vx); p.ground=false; moveY(p,p.vy);
  if(!p.ground){ const probe={x:p.x,y:p.y+0.5,w:p.w,h:p.h}; if(collides(probe)) p.ground=true; }

  // dynamite
  if((pressed('bomb')||(pressed('down')&&p.ground)) && !dyn && bombs>0){
    bombs--; dyn={x:p.x+p.w/2-2+(p.face>0?2:-2),y:p.y+p.h-10,w:4,h:10,vy:0,t:100,ground:false};
    beep(900,0.05,'square',0.04);
  }
  if(dyn){
    dyn.vy=Math.min(3,dyn.vy+0.2); dyn.ground=false; moveY(dyn,dyn.vy);
    dyn.t--; if(dyn.t%10===0) beep(1500,0.02,'square',0.02);
    if(dyn.t<=0){ const d=dyn; dyn=null; explode(d); if(state!=='play') return; }
  }

  // laser
  laser=null;
  if(keys.fire){
    const ly=p.y+4, sx=p.face>0?p.x+p.w:p.x;
    let len=0, hitTile=null;
    while(len<80){ const tx=Math.floor((sx+p.face*(len+1))/T), ty=Math.floor(ly/T); const c=tile(tx,ty);
      if(isSolid(c)){ if(c==='W') hitTile=[tx,ty]; break; } len+=2; }
    laser={x:p.face>0?sx:sx-len,y:ly,w:len,h:2};
    if(hitTile){ const k=hitTile[0]+','+hitTile[1]; wallHP[k]=(wallHP[k]||0)+1;
      if(frame%6===0) burst(p.face>0?sx+len:sx-len,ly,1,[WALL1,C.white],1);
      if(wallHP[k]>=150) destroyColumn(hitTile[0],hitTile[1]); }
    enemies.forEach(e=>{ if(e.alive && overlap({x:laser.x,y:ly-1,w:len,h:3},e)) killEnemy(e); });
    if(frame%4===0) beep(1100+Math.random()*400,0.03,'sawtooth',0.015);
  }

  updateEnemies(); updateParticles();

  // hazards
  if(boxAny(p,1,c=>c==='L')) { die(); return; }
  if(boxAny(p,0,c=>c==='~')) { die(); return; }
  if(p.inv<=0 && enemies.some(e=>e.alive && overlap(p,e,2))) { die(); return; }
  if(!dark && boxAny(p,0,c=>c==='K')){ dark=true; beep(200,0.3,'triangle',0.06,-150); }

  // screen flip
  const sx=Math.floor((p.x+p.w/2)/VW), sy=Math.floor((p.y+p.h/2)/VH);
  if(sx!==curSX||sy!==curSY){ curSX=sx; curSY=sy; dark=false; checkpoint={x:p.x,y:p.y}; }

  // rescue
  if(miner && overlap(p,miner)){
    state='clear'; timer=0; laser=null; dyn=null;
    addScore(1000); jingle([523,659,784,1047,784,1047],110);
  }
}
let clearPhase=0;
function updateClear(){
  timer++;
  if(timer<70) return;
  if(energy>0){ const d=Math.min(energy,80); energy-=d; addScore(Math.round(d/10)); if(timer%3===0) beep(1200,0.02,'square',0.02); return; }
  if(bombs>0){ if(timer%12===0){ bombs--; addScore(50); beep(700,0.06,'square',0.04);} return; }
  if(!clearPhase){ clearPhase=timer; }
  if(timer-clearPhase>70){ clearPhase=0; levelIdx++; if(levelIdx%LEVELS.length===0) loop++; loadLevel(); }
}

// ---------- drawing ----------
function hash(x,y){ let h=(x*374761393+y*668265263)^0x5bd1e995; h=(h^(h>>>13))*1274126177; return (h^(h>>>16))>>>0; }
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function txt(s,x,y,c,size,align,bold){ ctx.font=(bold?'700 ':'')+(size||8)+"px Silkscreen, 'Courier New', monospace"; ctx.textAlign=align||'left'; ctx.textBaseline='top'; ctx.fillStyle='#000'; ctx.fillText(s,x+1,y+1); ctx.fillStyle=c; ctx.fillText(s,x,y); }

function drawTile(c,gx,gy,x,y,hide){
  if(c==='W'){
    if(hide) return;
    ctx.drawImage(wallCv,(gx*T)%64,(gy*T)%64,T,T,x,y,T,T);
    const hp=wallHP[gx+','+gy]||0;
    if(hp>0){ const n=Math.floor(hp/12); for(let i=0;i<n;i++){ const v=hash(gx+i,gy*7); R(x+(v&15),y+((v>>4)&15),2,2,'#000'); } }
  } else if(c==='L'){
    const f=(frame>>3)%4; ctx.drawImage(lavaCv,(gx*T)%64,f*64+(gy*T)%64,T,T,x,y,T,T);
  } else if(c==='~'){
    const f=(frame>>4)%4; ctx.drawImage(waterCv,(gx*T)%64,f*64+(gy*T)%64,T,T,x,y,T,T);
    if(tile(gx,gy-1)!=='~'){ R(x,y,T,2,'#000'); for(let i=0;i<T;i+=2){ const o=Math.round(Math.sin((gx*T+i+frame)*0.15)*1.2); R(x+i,y+2+o,1,1,C.lblue); } }
  } else if(c==='K'){
    if(hide) return;
    R(x+7,y,1,6,C.lgrey);
    R(x+4,y+6,8,7,C.dgrey); R(x+5,y+7,6,5,C.yellow);
    if(frame%40<20) R(x+6,y+8,4,3,C.white);
  }
}
function drawHero(x,y,face,spin,blink){
  if(blink) return;
  x=Math.round(x); y=Math.round(y);
  const P=(dx,dy,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(face>0?x+dx:x+(10-dx-w),y+dy,w,h); };
  const bw=[12,8,2,8][Math.floor(spin)%4];
  ctx.fillStyle=C.lgrey; ctx.fillRect(x+5-bw/2,y,bw,1);
  P(4,1,2,2,C.grey);
  P(0,6,2,6,C.dgrey); P(0,7,1,4,C.grey);
  P(2,3,6,2,C.cyan); P(2,5,2,2,C.cyan); P(8,3,1,2,C.white);
  P(4,5,4,2,C.lred); P(6,5,1,1,'#000');
  P(2,7,6,5,C.yellow); P(8,8,2,2,C.yellow); P(2,9,6,1,C.orange);
  P(2,12,2,2,C.dgrey); P(6,12,2,2,C.dgrey);
}
function drawMiner(m){
  const x=Math.round(m.x), y=Math.round(m.y), wave=Math.floor(frame/12)%2;
  R(x+2,y+2,6,2,C.lgrey); R(x+1,y+3,8,1,C.lgrey); R(x+4,y+1,2,1,C.yellow);
  R(x+3,y+4,4,3,C.lred);
  R(x+2,y+7,6,5,C.lblue); R(x+3,y+7,1,2,C.blue); R(x+6,y+7,1,2,C.blue);
  if(wave){ R(x+8,y+4,2,4,C.lred); } else { R(x+8,y+6,2,2,C.lblue); R(x+9,y+3,1,3,C.lred); }
  R(x,y+7,2,4,C.lblue);
  R(x+2,y+12,2,2,C.brown); R(x+6,y+12,2,2,C.brown);
  if(frame%60<30) txt('apua!',x+5,y-10,C.white,8,'center');
}
function drawEnemy(e){
  const x=Math.round(e.x), y=Math.round(e.y), f=Math.floor(e.t/6)%2;
  if(e.type==='S'){
    R(x+6,e.top,1,y-e.top+2,C.lgrey);
    R(x+3,y+2,6,5,C.yellow); R(x+4,y+1,4,1,C.yellow); R(x+4,y+3,1,1,C.brown); R(x+7,y+3,1,1,C.brown); R(x+5,y+7,2,2,C.yellow);
    for(let i=0;i<3;i++){ R(x,y+2+i*3+(f&&i===1?1:0),3,1,C.yellow); R(x+9,y+2+i*3+(!f&&i===1?1:0),3,1,C.yellow); }
  } else if(e.type==='B'){
    R(x+4,y+3,4,5,C.orange); R(x+5,y+4,1,1,C.yellow); R(x+7,y+4,1,1,C.yellow);
    if(f){ R(x,y,4,2,'#b0773a'); R(x+1,y+2,3,2,C.orange); R(x+8,y,4,2,'#b0773a'); R(x+8,y+2,3,2,C.orange); } else { R(x,y+6,4,2,'#b0773a'); R(x+1,y+4,3,2,C.orange); R(x+8,y+6,4,2,'#b0773a'); R(x+8,y+4,3,2,C.orange); }
  } else if(e.type==='O'){
    R(x+5,y+2,2,7,C.brown);
    const wc=f?C.lgrey:C.white;
    R(x+1,y+(f?1:3),4,4,wc); R(x+7,y+(f?1:3),4,4,wc);
    R(x+4,y,1,2,C.brown); R(x+7,y,1,2,C.brown);
  } else if(e.type==='N'){
    const d=e.dir;
    for(let i=0;i<4;i++){ const sx=d>0?x+i*3:x+e.w-3-i*3; R(sx,y+3+((i+f)%2),4,3,i%2?C.green:C.lgreen); }
    const hx=d>0?x+e.w-4:x; R(hx,y+1,5,5,C.green); R(d>0?hx+3:hx+1,y+2,1,1,C.yellow);
    if(f) R(d>0?hx+5:hx-2,y+4,2,1,C.lred);
  }
}
function drawHUD(){
  const y=VH;
  R(0,y,VW,62,'#6C6C6C'); R(0,y+62,VW,HUD-62,'#000');
  ctx.font="700 8px Silkscreen, 'Courier New', monospace"; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle=C.white; ctx.fillText('VOIMA',10,y+6);
  const em=energyMax(), bx=50, bw=VW-50-12, fill=Math.max(0,Math.round(bw*energy/em));
  R(bx,y+7,bw,6,C.orange); R(bx,y+7,fill,6,C.yellow);
  for(let i=0;i<Math.min(lives-1,8);i++) drawHero(30+i*14,y+18,1,0,false);
  for(let i=0;i<bombs;i++){ const dx=190+i*13; R(dx,y+25,7,7,C.orange); R(dx+3,y+19,1,6,C.yellow); R(dx+1,y+20,5,1,C.yellow); }
  ctx.font="700 16px Silkscreen, 'Courier New', monospace";
  ctx.fillStyle=C.yellow; ctx.fillText('TASO:'+(levelIdx%LEVELS.length+1),30,y+39);
  ctx.textAlign='right'; ctx.fillStyle=C.white; ctx.fillText(String(score),VW-14,y+39);
  ctx.font="700 8px Silkscreen, 'Courier New', monospace"; ctx.textAlign='center'; ctx.fillStyle=C.white;
  ctx.fillText('SYVÄ KUILU',VW/2,y+65);
}
function drawTitle(){
  R(0,0,VW,VH+HUD,'#000');
  ctx.drawImage(getTitleCv(),0,0);
  txt('Syvä kuilu',VW/2,22,C.yellow,16,'center',true);
  txt('Pelastuslento vuoren uumeniin',VW/2,46,C.cyan,8,'center');
  const hy=70+Math.sin(frame*0.06)*6; drawHero(VW/2-5,hy,1,frame*0.8,false);
  const lines=['Kaivosmiehet jäivät loukkuun.','25 tasoa. Lennä alas, raivaa seinät','ja pelasta joka tasolta yksi mies.'];
  lines.forEach((l,i)=>txt(l,VW/2,100+i*12,C.white,8,'center'));
  if(frame%60<40) txt(coarse?'Napauta aloittaaksesi':'Paina välilyöntiä',VW/2,138,C.yellow,8,'center',true);
  if(unlocked>0) txt('< Aloitustaso '+(startSel+1)+' / '+LEVELS.length+' >',VW/2,152,C.cyan,8,'center');
  R(0,VH,VW,62,'#6C6C6C'); R(0,VH+62,VW,HUD-62,'#000');
  txt('Ennätys',VW/2,VH+12,C.white,8,'center',true);
  txt(String(hi),VW/2,VH+28,C.yellow,16,'center',true);
}
function render(){
  R(0,0,VW,VH+HUD,'#000');
  if(state==='title'){ drawTitle(); return; }
  const lit = !dark || flash>0;
  if(lit && levelCv) ctx.drawImage(levelCv,curSX*VW,curSY*VH,VW,VH,0,0,VW,VH);
  if(flash>0 && flash%4<2){ ctx.globalAlpha=0.25; R(0,0,VW,VH,C.white); ctx.globalAlpha=1; }
  for(let ty=0;ty<SH;ty++) for(let tx=0;tx<SW;tx++){
    const gx=curSX*SW+tx, gy=curSY*SH+ty; const c=tile(gx,gy);
    if(c!==' '&&c!=='#') drawTile(c,gx,gy,tx*T,ty*T,!lit);
  }
  ctx.save(); ctx.translate(-curSX*VW,-curSY*VH);
  if(miner) drawMiner(miner);
  enemies.forEach(e=>{ if(e.alive) drawEnemy(e); });
  if(dyn){ R(dyn.x,dyn.y,4,10,C.orange); R(dyn.x+1,dyn.y-2,1,2,C.lgrey); if(frame%4<2) R(dyn.x,dyn.y-4,3,2,frame%8<4?C.yellow:C.white); }
  if(laser && frame%3!==0){ const off=(frame*2)%6; for(let i=-off;i<laser.w;i+=6){ const a=Math.max(0,i), w=Math.min(i+4,laser.w)-a; if(w>0) R(laser.x+a,laser.y,w,1,C.lred); } }
  if(state!=='dying' && state!=='over') drawHero(player.x,player.y,player.face,player.anim,player.inv>0 && frame%6<3);
  particles.forEach(p=>R(p.x,p.y,2,2,p.c));
  popups.forEach(p=>txt(p.t,p.x,p.y,C.white,8,'center',true));
  ctx.restore();
  drawHUD();
  if(banner>0 && state==='play') txt('Taso '+(levelIdx%LEVELS.length+1)+' / '+LEVELS.length+(loop?' – kierros '+(loop+1):''),VW/2,VH/2-30,C.yellow,8,'center');
  if(state==='paused'){ R(VW/2-60,VH/2-14,120,28,'#000'); txt('Tauko',VW/2,VH/2-4,C.white,8,'center'); }
  if(state==='clear'){ R(VW/2-90,VH/2-24,180,48,'#000'); R(VW/2-90,VH/2-24,180,2,C.yellow);
    txt('Kaivosmies pelastettu!',VW/2,VH/2-14,C.yellow,8,'center'); txt('Bonus lasketaan',VW/2,VH/2+4,C.white,8,'center'); }
  if(state==='over'){ R(VW/2-80,VH/2-26,160,52,'#000'); R(VW/2-80,VH/2-26,160,2,C.lred);
    txt('Peli päättyi',VW/2,VH/2-16,C.lred,8,'center'); txt('Pisteet '+score,VW/2,VH/2-2,C.white,8,'center');
    if(timer<=0) txt(coarse?'Napauta jatkaaksesi':'Paina välilyöntiä',VW/2,VH/2+12,C.yellow,8,'center'); }
}

// ---------- loop ----------
let last=0, acc=0; const STEP=1000/60;
function tick(ts){
  if(!last) last=ts; acc+=Math.min(100,ts-last); last=ts;
  while(acc>=STEP){ update(); for(const k in keys) prev[k]=keys[k]; acc-=STEP; }
  render(); requestAnimationFrame(tick);
}
if(document.fonts && document.fonts.load){ document.fonts.load("8px Silkscreen").catch(()=>{}); document.fonts.load("700 16px Silkscreen").catch(()=>{}); }
window.__game={update,render,keys,get state(){return state},get level(){return levelIdx},player,loadLevel,LEVELS};
requestAnimationFrame(tick);
cv.focus();
})();
</script>

function catmull(pts,spacing){
 const out=[],n=pts.length;
 for(let i=0;i<n;i++){
  const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  const steps=Math.max(2,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/spacing));
  for(let s=0;s<steps;s++){
   const t=s/steps,t2=t*t,t3=t2*t;
   const f=k=>0.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);
   out.push({x:f(0),y:f(1)});
  }
 }
 return out;
}
function resample(p,step){
 const out=[{x:p[0].x,y:p[0].y}]; let need=step;
 for(let i=0;i<p.length;i++){
  const b=p[(i+1)%p.length]; let ax=p[i].x,ay=p[i].y,seg=Math.hypot(b.x-ax,b.y-ay);
  while(seg>=need){const t=need/seg; ax+=(b.x-ax)*t; ay+=(b.y-ay)*t; out.push({x:ax,y:ay}); seg-=need; need=step;}
  need-=seg;
 }
 const l=out[out.length-1]; if(Math.hypot(l.x-out[0].x,l.y-out[0].y)<step*0.5)out.pop();
 return out;
}
const inRange=(i,a,b)=>a<=b?i>=a&&i<=b:(i>=a||i<=b);
function segX(a,b,c,d){const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0}
function localOf(T,k,x,y){const p=T.path[k],a=T.ang[k],ca=Math.cos(a),sa=Math.sin(a),dx=x-p.x,dy=y-p.y;return [dx*ca+dy*sa,-dx*sa+dy*ca]}
function inGap(T,g,x,y,pad){const [lx,ly]=localOf(T,g.k,x,y);return ((lx-36)/(30+pad))**2+(ly/(T.RW/2+90+pad))**2<1}
function nearest(T,x,y){

function aiInput(c,T){
 const ai=c.ai,N=T.N,sp=Math.hypot(c.vx,c.vy);
 if(c.airT>0||c.sinkT>0)return NOINP;
 if(ai.revT>0){ai.revT-=DT; return {up:false,down:true,steer:ai.revSteer}}
 let rampAhead=false; for(const r of T.ramps){const ah=(r.k-c.idx+N)%N; if(ah>0&&ah<26)rampAhead=true}
 if(rampAhead){ai.laneTarget=0; ai.lane*=0.9}
 ai.laneT-=DT; if(ai.laneT<=0){ai.laneT=1.2+Math.random()*2.5; ai.laneTarget=(Math.random()-.5)*T.RW*.5}
 ai.lane+=(ai.laneTarget-ai.lane)*.02;
 const k=(c.idx+5+Math.round(sp*2.2))%N,p=T.path[k],pa=T.ang[k]+Math.PI/2;
 const tx=p.x+Math.cos(pa)*ai.lane,ty=p.y+Math.sin(pa)*ai.lane;
 const diff=angN(Math.atan2(ty-c.y,tx-c.x)-c.a),steer=clamp(diff*2.6,-1,1);
 const curve=Math.abs(angN(T.ang[(c.idx+6+Math.round(sp*3))%N]-T.ang[c.idx]));
 let want=topSpeed(c)*(1-Math.min(.55,curve*.6/Math.max(.6,T.th.grip)));
 if(rampAhead)want=topSpeed(c);
 ai.wait=false;
 if(T.train)for(const cr of T.crossings){if(!cr.danger)continue; const ah=(cr.i-c.idx+N)%N; if(ah>0&&ah<11){want=0;ai.wait=true}}
 const fwd=c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a);
 if(R.t>1.5&&sp<0.3&&!ai.wait){ai.stuck+=DT; if(ai.stuck>1.1){ai.revT=.9; ai.revSteer=diff>0?-1:1; ai.stuck=0}} else ai.stuck=0;
 return {up:fwd<want,down:fwd>want+.45||(ai.wait&&fwd>0.1),steer};
}
function aiWeapons(c){
 if(c.cool>0||R.t<2)return;
 for(const o of R.cars){
  if(o===c||o.wreckT>0||o.airT>0||o.level!==c.level)continue;
  const dx=o.x-c.x,dy=o.y-c.y,d=Math.hypot(dx,dy); if(d>240||d<14)continue;
  const da=Math.abs(angN(Math.atan2(dy,dx)-c.a));
  if(da<0.12&&c.front>0&&Math.random()<0.05){fire(c,'front');return}
  if(da>Math.PI-0.14&&c.rear>0&&d<170&&Math.random()<0.04){fire(c,'rear');return}
  if(da>Math.PI-0.5&&c.mines>0&&d<110&&Math.random()<0.02){fire(c,'mine');return}
 }
}
function fire(c,type){
 if(c.cool>0||c.wreckT>0)return;
 const hx=Math.cos(c.a),hy=Math.sin(c.a);
 if(type==='front'&&c.front>0){c.front--; R.proj.push({x:c.x+hx*11,y:c.y+hy*11,vx:hx*7.5+c.vx*.4,vy:hy*7.5+c.vy*.4,a:c.a,owner:c,life:90}); c.cool=0.28; sfx('shoot')}
 else if(type==='rear'&&c.rear>0){c.rear--; R.proj.push({x:c.x-hx*12,y:c.y-hy*12,vx:-hx*6.5+c.vx*.3,vy:-hy*6.5+c.vy*.3,a:c.a+Math.PI,owner:c,life:80}); c.cool=0.3; sfx('shoot')}
 else if(type==='mine'&&c.mines>0){c.mines--; R.mines.push({x:c.x-hx*13,y:c.y-hy*13,owner:c,arm:0.5,level:c.level}); if(R.mines.length>40)R.mines.shift(); c.cool=0.4; sfx('mine')}
}
function addDamage(c,amt,src){
 if(c.wreckT>0||c.invT>0)return;
 c.damage=Math.min(100,c.damage+amt*(1-0.15*c.armor));
 if(c.damage>=100){c.wreckT=2.5; c.spinT=0; boom(c.x,c.y,2.6); sfx('boom'); if(src&&src!==c)src.kills++}
}
function respawn(c,T,dmg){
 const p=T.path[c.idx]; c.x=p.x; c.y=p.y; c.a=T.ang[c.idx]; c.vx=c.vy=0; c.damage=dmg==null?45:dmg; c.airT=0; c.sinkT=0; c.boostT=0; c.invT=2; c.spinT=0; c.oilT=0;
}
function stepCar(c,inp,T){
 if(c.wreckT>0){
  c.wreckT-=DT; c.vx*=0.9; c.vy*=0.9; c.x+=c.vx; c.y+=c.vy;
  if(Math.random()<0.3)R.parts.push({x:c.x+(Math.random()-.5)*8,y:c.y+(Math.random()-.5)*8,vx:(Math.random()-.5)*.4,vy:-.3-Math.random()*.4,life:1,max:1,col:'#3a3a3a',sz:4});
  if(c.wreckT<=0)respawn(c,T);
  return;
 }
 if(c.sinkT>0){
  c.sinkT-=DT; c.vx*=.85; c.vy*=.85; c.x+=c.vx; c.y+=c.vy;
  if(c.sinkT<=0){c.idx=(c.sinkK+5)%T.N; respawn(c,T,Math.min(95,c.damage+10))}
  return;
 }
 if(c.invT>0)c.invT-=DT;
 if(c.boostT>0)c.boostT-=DT;
 if(c.airT>0){
  c.airT--; c.x+=c.vx; c.y+=c.vy; c.x=clamp(c.x,12,T.w-12); c.y=clamp(c.y,12,T.h-12);
  if(c.airT<=0){
   for(let i=0;i<12;i++){const a=Math.random()*6.283; R.parts.push({x:c.x,y:c.y,vx:Math.cos(a)*1.2,vy:Math.sin(a)*1.2,life:.45,max:.45,col:'#b9b2a2',sz:3})}
   sfx('bump');
  }
  c.px=c.x; c.py=c.y;
  return;
 }
 const th=T.th; c.off=nearest(T,c.x,c.y).d>T.RW/2+3;
 let maxSp=topSpeed(c); if(c.off)maxSp*=0.5; if(c.boostT>0)maxSp*=1.35;
 const acc=(0.05+0.012*c.engine)*(c.boostT>0?2.2:1);
 let grip=(0.15+0.04*c.tyres)*th.grip; if(c.off)grip*=0.7;
 if(c.oilT>0){c.oilT-=DT; grip=0.02}
 const hx=Math.cos(c.a),hy=Math.sin(c.a);
 let fwd=c.vx*hx+c.vy*hy,lat=-c.vx*hy+c.vy*hx;
 if(c.spinT>0){c.spinT-=DT; c.a+=0.2*c.spinDir; fwd*=0.97}
 else{
  if(inp.up){if(fwd<maxSp)fwd=Math.min(maxSp,fwd+acc)}
  else if(!inp.down)fwd*=0.987;
  if(inp.down){if(fwd>0.15)fwd-=0.12; else fwd=Math.max(-1.3,fwd-0.045)}
  if(c.boostT>0&&fwd<maxSp)fwd=Math.min(maxSp,fwd+0.08);
  if(fwd>maxSp)fwd-=(fwd-maxSp)*0.06;
  c.a+=inp.steer*0.054*clamp(fwd/1.6,-1,1);
 }
 const sp=Math.hypot(c.vx,c.vy);
 if(Math.abs(lat)>0.9&&sp>1.4&&!c.off){
  T.g.fillStyle='rgba(0,0,0,.2)';
  for(const s of [-4,4])T.g.fillRect(c.x-hx*5-hy*s-1,c.y-hy*5+hx*s-1,2,2);
 }
 lat*=(1-grip);
 c.vx=hx*fwd-hy*lat; c.vy=hy*fwd+hx*lat;
 c.px=c.x; c.py=c.y;
 c.x+=c.vx; c.y+=c.vy;
 if(c.x<12){c.x=12;c.vx=Math.abs(c.vx)*.5} if(c.x>T.w-12){c.x=T.w-12;c.vx=-Math.abs(c.vx)*.5}
 if(c.y<12){c.y=12;c.vy=Math.abs(c.vy)*.5} if(c.y>T.h-12){c.y=T.h-12;c.vy=-Math.abs(c.vy)*.5}
 for(const t of T.trees){
  const dx=c.x-t.x,dy=c.y-t.y,rr=t.r+5;
  if(dx*dx+dy*dy<rr*rr){
   const d=Math.sqrt(dx*dx+dy*dy)||1,nx=dx/d,ny=dy/d; c.x=t.x+nx*rr; c.y=t.y+ny*rr;
   const vn=c.vx*nx+c.vy*ny;
   if(vn<0){c.vx-=1.5*vn*nx; c.vy-=1.5*vn*ny; c.vx*=.6; c.vy*=.6; if(-vn>1.2){addDamage(c,-vn*5,null); sfx('bump')}}
  }
 }
 if(c.oilT<=0&&sp>1)for(const o of T.oil){
  if((c.x-o.x)**2+(c.y-o.y)**2<o.r*o.r){c.oilT=0.8; c.spinT=0.35; c.spinDir=Math.random()<.5?-1:1}
 }
 featureCheck(c,T);
 if(c.off&&sp>1.2&&Math.random()<.4)R.parts.push({x:c.x-hx*7,y:c.y-hy*7,vx:-c.vx*.2+(Math.random()-.5)*.5,vy:-c.vy*.2+(Math.random()-.5)*.5,life:.5,max:.5,col:th.g3,sz:3});
 if(c.damage>60&&Math.random()<c.damage/400)R.parts.push({x:c.x,y:c.y,vx:(Math.random()-.5)*.3,vy:-.3,life:.8,max:.8,col:'#555',sz:3});
}
function featureCheck(c,T){
 for(const r of T.ramps){
  const [lx,ly]=localOf(T,r.k,c.x,c.y); if(lx<0||lx>14||Math.abs(ly)>T.RW/2)continue;
  const [plx]=localOf(T,r.k,c.px,c.py);
  if(plx<0){const sp=Math.hypot(c.vx,c.vy); if(sp>1.2){let air=Math.round(clamp(sp*12,18,56)); if(r.gap&&sp>1.5)air=Math.max(air,Math.ceil(80/sp)); c.airMax=c.airT=air; c.spinT=0; c.oilT=0; sfx('jump'); return}}
 }
 for(const g of T.gaps){
  if(inGap(T,g,c.x,c.y,0)){
   c.sinkT=1.2; c.sinkK=g.k; c.spinT=0; const ch=T.th.tree==='rock';
   for(let i=0;i<18;i++){const a=Math.random()*6.283,v=Math.random()*2; R.parts.push({x:c.x,y:c.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.6,max:.6,col:ch?['#5a3422','#874c30'][i&1]:['#bfe0ff','#5d9be0','#ffffff'][i%3],sz:3})}
   sfx('splash'); return;
  }
 }
 for(const b of T.boosts){const [lx,ly]=localOf(T,b.k,c.x,c.y); if(Math.abs(lx)<16&&Math.abs(ly)<20)c.boostT=1.0}
}
function updProg(c,T){
 const N=T.N; let best=c.idx,bd=1e18;
 for(let k=-6;k<=14;k++){const j=(c.idx+k+N)%N,p=T.path[j],d=(p.x-c.x)**2+(p.y-c.y)**2; if(d<bd){bd=d;best=j}}
 if(c.idx>N-25&&best<25)c.lap++; else if(c.idx<25&&best>N-25)c.lap--;
 c.idx=best; c.prog=c.lap*N+best;
}
function boom(x,y,s){
 const n=(14*s)|0;
 for(let i=0;i<n;i++){const a=Math.random()*6.283,v=Math.random()*2.2*s;
  R.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+Math.random()*.5,max:.8,col:['#fff3a0','#ffb02e','#ff5a1a','#8a2a10'][(Math.random()*4)|0],sz:2+((Math.random()*3*s)|0),glow:true})}
}
function updTrain(T){
 const tr=T.train; tr.t++; tr.head=(tr.t%tr.period)*tr.speed;
 for(const cr of T.crossings)cr.danger=tr.head>cr.s-tr.speed*60*2.6&&tr.head-tr.len<cr.s+40;
 if(tr.head-tr.len>tr.L)return;
 for(const c of R.cars){
  if(c.trainCD>0||c.wreckT>0||c.airT>0||c.sinkT>0)continue;
  const rx=c.x-tr.ax,ry=c.y-tr.ay,s=rx*tr.dx+ry*tr.dy,pp=-rx*tr.dy+ry*tr.dx;
  if(Math.abs(pp)<17&&s<tr.head+6&&s>tr.head-tr.len-4){
   const sg=pp>=0?1:-1,push=18-Math.abs(pp);
   c.x+=-tr.dy*sg*push; c.y+=tr.dx*sg*push;
   c.vx=-tr.dy*sg*3.5+tr.dx*tr.speed*.8; c.vy=tr.dx*sg*3.5+tr.dy*tr.speed*.8;
   c.spinT=.7; c.spinDir=sg; c.trainCD=1; addDamage(c,55,null); boom(c.x,c.y,1.2); sfx('boom');
  }
 }
}
function trainHit(x,y,m){
 const tr=R.T.train; if(!tr)return false;
 const rx=x-tr.ax,ry=y-tr.ay,s=rx*tr.dx+ry*tr.dy,pp=-rx*tr.dy+ry*tr.dx;
 return Math.abs(pp)<11+m&&s<tr.head&&s>tr.head-tr.len;
}

/* ---------- race flow ---------- */
function createRace(def,drivers,demo){
 const T=buildTrack(def);
 const order=demo?drivers:[...drivers.filter(d=>!d.hum),...drivers.filter(d=>d.hum)];
 R={T,demo,laps:demo?2:def.laps,cars:[],proj:[],mines:[],parts:[],t:demo?0:-3.2,frame:0,finishedOrder:[],endT:0,done:false,lastSec:99,goPlayed:false,sorted:[]};
 R.cars=order.map((d,i)=>makeCar(d,i,T,demo));
 R.humCars=demo?[]:G.humans.map(h=>R.cars.find(c=>c.hum===h));
 R.cams=(demo?[R.cars[0]]:R.humCars).map(c=>({x:c.x,y:c.y,car:c}));
 R.sorted=R.cars.slice();
 return R;
}
function startDemo(){
 const def=TRACKS[(Math.random()*TRACKS.length)|0];
 createRace(def,shuffle(AI_DRIVERS).slice(0,7).map(a=>({name:a.name,color:a.color,hum:null,points:0})),true);
}
function newGame(players){

 G.players=players; G.division=1; G.raceNo=0; G.quote=null;
 G.humans=[{name:'P1',color:'#e8392f',map:players===1?MAPS.solo:MAPS.p1,stats:freshStats()}];
 if(players===2)G.humans.push({name:'P2',color:'#18c6e6',map:MAPS.p2,stats:freshStats()});
 G.drivers=G.humans.map(h=>({name:players===1?'Sinä':h.name,color:h.color,hum:h,points:0}));
 G.drivers.push(...shuffle(AI_DRIVERS).slice(0,7-G.humans.length).map(a=>({name:a.name,color:a.color,hum:null,points:0})));
 showShop();

function trackTags(d){
 const t=[THEMES[d.theme].label];
 if(d.ramps||d.gaps)t.push('hyppyrit'); if(d.gaps)t.push(THEMES[d.theme].tree==='rock'?'rotko':'joki');
 if(d.tunnels)t.push('tunneli'); if(d.bridge)t.push('silta'); if(d.train)t.push('juna'); if(d.boosts)t.push('vauhtikaistat');
 return t.join(', ');
}

 G.humans=[{name:'P1',color:'#e8392f',map:MAPS.solo,stats:{money:0,engine:1,tyres:1,armor:1,front:10,rear:5,mines:5,damage:0}}];
 G.drivers=[{name:'Sinä',color:'#e8392f',hum:G.humans[0],points:0},...shuffle(AI_DRIVERS).slice(0,6).map(a=>({name:a.name,color:a.color,hum:null,points:0}))];

function startRace(){

function finishRace(){
 if(R.done)return; R.done=true;
 const order=[...R.finishedOrder,...R.cars.filter(c=>!c.finished).sort((a,b)=>b.prog-a.prog)];
 order.forEach((c,i)=>{
  c.place=i+1; c.ptsGained=POINTS[i]||0; c.d.points+=c.ptsGained;
  if(c.human){const s=c.hum.stats; c.prize=PRIZES[i]||0; s.money+=c.prize+c.kills*KILL_BONUS;
   s.damage=Math.min(95,Math.round(c.damage)); s.front=c.front; s.rear=c.rear; s.mines=c.mines;}
 });
 G.lastOrder=order; G.mode='results'; showResults();
}
function quitToMenu(){G.paused=false; G.mode='menu'; startDemo(); showMenu();}

function update(){
 const T=R.T; R.t+=DT; R.frame++;
 if(!R.demo){
  if(R.t<0){const sec=Math.ceil(-R.t); if(sec!==R.lastSec){R.lastSec=sec; if(sec<=3)sfx('beep')}}
  else if(!R.goPlayed){R.goPlayed=true; sfx('go')}
 }
 if(T.train)updTrain(T);
 const go=R.t>=0;
 for(const c of R.cars){
  let inp=NOINP; c.cool-=DT; c.trainCD-=DT;
  if(go&&c.wreckT<=0)inp=(c.human&&!c.finished)?humInput(c):aiInput(c,T);
  stepCar(c,inp,T);
  if(go&&c.wreckT<=0&&c.airT<=0&&c.sinkT<=0){
   if(c.human&&!c.finished){if(inp.front)fire(c,'front'); if(inp.rear)fire(c,'rear'); if(inp.mine)fire(c,'mine')}
   else if(!c.human)aiWeapons(c);
  }
  updProg(c,T);
  c.level=T.bridge&&inRange(c.idx,T.bridge.i0,T.bridge.i1)?1:0;
  if(!c.finished&&c.lap>R.laps){c.finished=true; c.finishTime=R.t; R.finishedOrder.push(c); if(c.human)sfx('go')}
 }
 // car vs car
 const cs=R.cars;
 for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
  const a=cs[i],b=cs[j]; if(a.wreckT>0||b.wreckT>0||a.level!==b.level||a.airT>0||b.airT>0||a.sinkT>0||b.sinkT>0)continue;
  const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy; if(d2>=169||d2===0)continue;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(13-d)/2;
  a.x-=nx*o; a.y-=ny*o; b.x+=nx*o; b.y+=ny*o;
  const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
  if(rel>0){const im=rel*.85; a.vx-=im*nx; a.vy-=im*ny; b.vx+=im*nx; b.vy+=im*ny;
   if(rel>1.8){addDamage(a,rel*2.2,b); addDamage(b,rel*2.2,a); sfx('bump')}}
 }
 // missiles
 for(let i=R.proj.length-1;i>=0;i--){
  const p=R.proj[i]; p.x+=p.vx; p.y+=p.vy; p.life--;
  if(Math.random()<.8)R.parts.push({x:p.x-p.vx,y:p.y-p.vy,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,life:.35,max:.35,col:'#bbb',sz:2});
  let hit=false;
  for(const c of R.cars){
   if(c===p.owner||c.wreckT>0||c.airT>0||c.sinkT>0||c.level!==p.owner.level)continue;
   if((c.x-p.x)**2+(c.y-p.y)**2<100){addDamage(c,28,p.owner); c.spinT=Math.max(c.spinT,.3); c.spinDir=Math.random()<.5?-1:1; c.vx+=p.vx*.25; c.vy+=p.vy*.25; hit=true; break}
  }
  if(!hit)for(const t of T.trees)if((t.x-p.x)**2+(t.y-p.y)**2<t.r*t.r){hit=true;break}
  if(!hit&&T.train&&trainHit(p.x,p.y,4))hit=true;
  if(hit||p.life<=0||p.x<0||p.y<0||p.x>T.w||p.y>T.h){boom(p.x,p.y,hit?1:0.5); if(hit)sfx('hit'); R.proj.splice(i,1)}
 }
 // mines
 for(let i=R.mines.length-1;i>=0;i--){
  const m=R.mines[i]; m.arm-=DT; if(m.arm>0)continue;
  for(const c of R.cars){
   if(c.wreckT>0||c.airT>0||c.sinkT>0||c.level!==(m.level||0)||(c===m.owner&&m.arm>-1.2))continue;
   if((c.x-m.x)**2+(c.y-m.y)**2<90){addDamage(c,32,m.owner); c.spinT=.6; c.spinDir=Math.random()<.5?-1:1; c.vx*=.3; c.vy*=.3; boom(m.x,m.y,1.3); sfx('hit'); R.mines.splice(i,1); break}
  }
 }
 // particles
 for(const p of R.parts){p.x+=p.vx; p.y+=p.vy; p.vx*=.94; p.vy*=.94; p.life-=DT}
 R.parts=R.parts.filter(p=>p.life>0); if(R.parts.length>700)R.parts.splice(0,R.parts.length-700);
 // ranking
 R.sorted=R.cars.slice().sort((a,b)=>{if(a.finished&&b.finished)return a.finishTime-b.finishTime; if(a.finished)return -1; if(b.finished)return 1; return b.prog-a.prog});
 R.sorted.forEach((c,i)=>c.pos=i+1);
 for(const cam of R.cams){
  const c=R.demo?R.sorted[0]:cam.car; cam.car=c;
  cam.x+=(c.x+c.vx*24-cam.x)*(R.demo?.05:.09); cam.y+=(c.y+c.vy*24-cam.y)*(R.demo?.05:.09);
 }
 if(R.demo){
  if(R.finishedOrder.length){R.endT+=DT; if(R.endT>4)startDemo()} else if(R.t>150)startDemo();
 } else if(!R.done){

function stripPath(T,i0,i1){ctx.beginPath(); let i=i0,n=0; ctx.moveTo(T.path[i].x,T.path[i].y); while(i!==i1&&n<T.N){i=(i+1)%T.N; ctx.lineTo(T.path[i].x,T.path[i].y); n++}}

  for(const i of [t.i0,t.i1]){

}
function drawBridge(T){

function drawTrain(T,vis){

  const s1=tr.head-k*tr.seg,s0=s1-tr.carL,sm=(s0+s1)/2,x=tr.ax+tr.dx*sm,y=tr.ay+tr.dy*sm;

  } else {

function nightOverlay(vx,vy,vw,vh,ox,oy){

 for(const l of T.lamps){const x=l.x-ox,y=l.y-oy; if(x>-80&&x<vw+80&&y>-80&&y<vh+80)glow(x,y,72,0.85)}
 for(const cr of T.crossings)if(cr.danger&&((R.frame>>4)&1))for(const l of cr.lights)glow(l.x-ox,l.y-oy,26,0.9);
 if(T.train){const tr=T.train; if(tr.head-tr.len<tr.L)for(let k=0;k<tr.cars;k++){const sm=tr.head-k*tr.seg-tr.carL/2; glow(tr.ax+tr.dx*sm-ox,tr.ay+tr.dy*sm-oy,k?34:60,k?0.5:0.85)}}

  const g=n.createRadialGradient(8,0,0,8,0,130); g.addColorStop(0,'rgba(0,0,0,.95)'); g.addColorStop(1,'rgba(0,0,0,0)');
  n.fillStyle=g; n.beginPath(); n.moveTo(6,0); n.arc(6,0,130,-0.42,0.42); n.closePath(); n.fill(); n.restore();
 }
 for(const p of R.parts)if(p.glow)glow(p.x-ox,p.y-oy,18,clamp(p.life/p.max,0,1));
 for(const p of R.proj)glow(p.x-ox,p.y-oy,14,0.8);
 n.globalCompositeOperation='source-over';

function viewport(vx,vy,vw,vh,cam,showHud,solo){
 const T=R.T,ox=Math.round(clamp(cam.x-vw/2,0,T.w-vw)),oy=Math.round(clamp(cam.y-vh/2,0,T.h-vh));

  const blink=(R.frame>>4)&1;

 };

 for(const c of R.cars)if(c.wreckT<=0&&c.airT<=0&&!c.level&&vis(c.x,c.y,20))drawCar(c);
 for(const p of R.proj)if(!p.owner.level&&vis(p.x,p.y,10))drawProj(p);

  drawTunnels(T);
  if(!R.demo&&((R.frame>>3)&1))for(const c of R.humCars)if(c.airT<=0&&T.tunnels.some(t=>inRange(c.idx,t.i0,t.i1))){ctx.strokeStyle=c.color; ctx.lineWidth=2; ctx.strokeRect(c.x-10,c.y-10,20,20)}
 }

 }

}
function buy(hi,id){
 const s=G.humans[hi].stats,it=ITEMS.find(x=>x.id===id),p=priceOf(s,it);
 if(p==null||p>s.money)return;
 if(id==='repair'){if(s.damage<=0)return; s.damage=0}
 else if(it.ammo){if(s[id]>=it.cap)return; s[id]=Math.min(it.cap,s[id]+5)}
 else s[id]++;
 s.money-=p; sfx('buy'); showShop();
}
function showShop(){
 G.mode='shop';
 if(!G.quote)G.quote=QUOTES[(Math.random()*QUOTES.length)|0];
 const def=TRACKS[G.raceNo%TRACKS.length],th=THEMES[def.theme];
 const cards=G.humans.map((h,hi)=>{
  const s=h.stats;
  const items=ITEMS.map(it=>{
   const p=priceOf(s,it); let state,can,label;
   if(it.id==='repair'){state=`vauriot ${Math.round(s.damage)} %`; can=s.damage>0&&p<=s.money; label=s.damage>0?fmtMoney(p):'Kunnossa'}
   else if(it.ammo){state=`${s[it.id]} kpl, enintään ${it.cap}`; can=s[it.id]<it.cap&&p<=s.money; label=fmtMoney(p)}
   else{state=`<span class="pips">${'■'.repeat(s[it.id])}${'□'.repeat(it.max-s[it.id])}</span> taso ${s[it.id]}/${it.max}`; can=p!=null&&p<=s.money; label=p==null?'Täynnä':fmtMoney(p)}
   return `<div class="item"><div><b>${it.name}</b><br><small>${it.desc}</small></div><button data-act="buy" data-h="${hi}" data-id="${it.id}" ${can?'':'disabled'}>${label}</button><div><small>${state}</small></div></div>`;
  }).join('');
  return `<div class="card"><div class="row" style="margin-top:0"><b class="px" style="color:${h.color};font-size:10px">${G.players===1?'Sinun autosi':h.name}</b><span class="money">${fmtMoney(s.money)}</span></div>${items}</div>`;
 }).join('');
 showOv(`<div class="panel wide"><h2>Masan korjaamo ja asekauppa</h2>
 <div class="quote">”${G.quote}” – Masa</div>
 <div class="shopgrid">${cards}</div>
 <div class="row"><span class="dim">Seuraavaksi kisa ${G.raceNo+1}/${SEASON}: <b>${esc(def.name)}</b>, ${th.label}${def.train?', tasoristeys':''}. Divisioona ${G.division}.</span><button data-act="race">Aja kisa</button></div></div>`);
}
function showPause(){
 showOv(`<div class="panel" style="width:min(360px,100%);text-align:center"><h2>Tauko</h2>
 <div class="btns"><button data-act="resume">Jatka</button><button data-act="mute">${AU.muted?'Ääni päälle':'Ääni pois'}</button><button data-act="quit">Lopeta</button></div>
 <p class="tiny">Lopettaminen palauttaa alkuvalikkoon. Kauden tilanne menetetään.</p></div>`);
}
ov.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
 const a=b.dataset.act;
 if(a==='new1')newGame(1);
 else if(a==='new2')newGame(2);
 else if(a==='buy')buy(+b.dataset.h,b.dataset.id);
 else if(a==='race')startRace();
 else if(a==='toshop'){G.raceNo++; G.quote=null; showShop()}
 else if(a==='season')showSeason();
 else if(a==='nextseason'){if(G.pendingPromote)G.division++; G.raceNo=0; G.quote=null; for(const d of G.drivers)d.points=0; showShop()}
 else if(a==='resume'){G.paused=false; hideOv()}
 else if(a==='quit')quitToMenu();
 else if(a==='mute'){initAudio(); toggleMute(); showPause()}
 else if(a==='quickmenu')showQuick();
 else if(a==='menu')showMenu();
 else if(a==='quick')newQuick(+b.dataset.t);
 else if(a==='quickagain')newQuick(G.raceNo);
});

/* ---------- input ---------- */
const BLOCK=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Quote']);
addEventListener('keydown',e=>{
 if(BLOCK.has(e.code)&&(G.mode==='race'||!(e.target&&e.target.tagName==='BUTTON')))e.preventDefault();
 keys[e.code]=true;
 if(e.repeat)return;
 if(e.code==='KeyM')toggleMute();
 if(G.mode==='race'&&(e.code==='KeyP'||e.code==='Escape')){
  if(!G.paused){G.paused=true; showPause()} else {G.paused=false; hideOv()}
 }
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false; if(G.mode==='race'&&!G.paused&&R&&!R.done){G.paused=true; showPause()}});
const stickZone=document.getElementById('stickZone'),stickBase=document.getElementById('stickBase'),stickKnob=document.getElementById('stickKnob'),stickHint=document.getElementById('stickHint'),stageEl=document.getElementById('stage');
function resetTouch(){TS.id=null; TS.mag=0; TS.sx=0; TS.brake=TS.front=TS.rear=TS.mine=false; stickBase.style.display='none'; for(const b of touchEl.querySelectorAll('[data-w]'))b.classList.remove('on')}
stickZone.addEventListener('pointerdown',e=>{
 if(TS.id!=null)return; e.preventDefault(); const r=stageEl.getBoundingClientRect();
 TS.id=e.pointerId; TS.ox=e.clientX-r.left; TS.oy=e.clientY-r.top; TS.mag=0;
 TS.sx=0; TS.bx=clamp(TS.ox,77,Math.max(77,r.width*0.55-77)); TS.by=clamp(TS.oy,34,r.height-34);
 stickBase.style.left=TS.bx+'px'; stickBase.style.top=TS.by+'px'; stickBase.style.display='block'; stickKnob.style.transform='translate('+(TS.ox-TS.bx)+'px,'+(TS.oy-TS.by)+'px)';
 stickHint.style.display='none';
 try{stickZone.setPointerCapture(e.pointerId)}catch(_){}
});
stickZone.addEventListener('pointermove',e=>{
 if(e.pointerId!==TS.id)return; const r=stageEl.getBoundingClientRect();
 const dx=e.clientX-r.left-TS.ox,R0=46,kx=clamp(dx,-R0,R0);
 TS.sx=kx/R0;
 stickKnob.style.transform='translate('+(TS.ox-TS.bx+kx)+'px,'+(TS.oy-TS.by)+'px)';
});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])stickZone.addEventListener(ev,e=>{if(e.pointerId!==TS.id)return; TS.id=null; TS.mag=0; TS.sx=0; stickBase.style.display='none'});
for(const b of touchEl.querySelectorAll('[data-w]')){
 const w=b.dataset.w;
 b.addEventListener('pointerdown',e=>{e.preventDefault(); TS[w]=true; b.classList.add('on'); try{b.setPointerCapture(e.pointerId)}catch(_){}});
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{TS[w]=false; b.classList.remove('on')});
 b.addEventListener('contextmenu',e=>e.preventDefault());
}
document.getElementById('pauseBtn').addEventListener('click',()=>{if(G.mode==='race'&&!G.paused&&R&&!R.done){G.paused=true; resetTouch(); showPause()}});
function checkPortrait(){if(isTouch()&&window.innerHeight>window.innerWidth&&G.mode==='race'&&!G.paused&&R&&!R.done){G.paused=true; resetTouch(); showPause()}}
addEventListener('resize',checkPortrait);
addEventListener('orientationchange',checkPortrait);
muteBtn.addEventListener('click',()=>{initAudio(); toggleMute()});

/* ---------- loop ---------- */
let acc=0,last=performance.now();
function frame(now){
 const dt=Math.min(0.1,(now-last)/1000); last=now;
 if(R&&!G.paused&&(R.demo||G.mode==='race')){acc+=dt; let n=0; while(acc>=DT&&n<8){update(); acc-=DT; n++}}
 else acc=0;
 render(); engineSound();
 requestAnimationFrame(frame);
}
startDemo(); showMenu();
requestAnimationFrame(frame);
window.__kp={TS,G,get R(){return R},createRace,update,render,newGame,startRace,TRACKS,keys};
})();
</script>
